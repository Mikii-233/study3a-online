<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study3a 图片加载诊断</title>
<script src="jspsych/jspsych.js"></script>
<script src="plugins/plugin-preload.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#1e1e24;color:#eee;margin:0;padding:20px;line-height:1.55}
.box{max-width:760px;margin:auto;background:#2b2b36;border:1px solid #555;border-radius:12px;padding:18px;box-sizing:border-box}
h1{font-size:24px;color:#64b5f6}.row{padding:10px 0;border-bottom:1px solid #444}.ok{color:#66d17a;font-weight:700}.bad{color:#ff7043;font-weight:700}.wait{color:#ffb74d}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;font-size:13px;color:#cfd8dc}.testimg{display:block;width:220px;max-width:80vw;height:auto;margin:10px auto;border:2px solid #666}.btn{padding:10px 18px;border:0;border-radius:8px;background:#4caf50;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="box">
<h1>Study3a 图片加载诊断</h1>
<p>此页面只测试 <b>high1.png</b>，不连接 DataPipe，也不运行正式实验。</p>
<div class="row"><b>当前页面：</b><div id="href" class="mono"></div></div>
<div class="row"><b>document.baseURI：</b><div id="base" class="mono"></div></div>
<div class="row"><b>相对路径解析结果：</b><div id="resolved" class="mono"></div></div>
<div class="row"><b>A. 可见 DOM &lt;img&gt;（相对路径）</b><div id="a" class="wait">等待...</div><img id="visibleImg" class="testimg" alt="high1 test"></div>
<div class="row"><b>B. new Image()（相对路径）</b><div id="b" class="wait">等待...</div></div>
<div class="row"><b>C. new Image()（绝对路径）</b><div id="c" class="wait">等待...</div></div>
<div class="row"><b>D. fetch()（绝对路径）</b><div id="d" class="wait">等待...</div></div>
<div class="row"><b>E. jsPsychPreload（只加载 high1.png）</b><div id="f" class="wait">尚未开始</div><button class="btn" id="runJs">开始 jsPsych 单图测试</button><div id="jspsych-diag-target" style="margin-top:10px"></div></div>
<div class="row"><b>F. 连续 13 个 new Image() 请求</b><div id="e" class="wait">尚未开始</div><button class="btn" id="run13">开始13张测试</button></div>
</div>
<script>
const rel='img/high1.png';
const abs=new URL(rel,document.baseURI).href;
document.getElementById('href').textContent=location.href;
document.getElementById('base').textContent=document.baseURI;
document.getElementById('resolved').textContent=abs;
function set(id,ok,msg){const el=document.getElementById(id);el.className=ok?'ok':'bad';el.textContent=(ok?'成功：':'失败：')+msg;}
const v=document.getElementById('visibleImg');
v.onload=()=>set('a',true,`${v.naturalWidth}×${v.naturalHeight}`);
v.onerror=(ev)=>set('a',false,'DOM img onerror');
v.src=rel;
const b=new Image(); b.onload=()=>set('b',true,`${b.naturalWidth}×${b.naturalHeight}`); b.onerror=()=>set('b',false,'new Image relative onerror'); b.src=rel;
const c=new Image(); c.onload=()=>set('c',true,`${c.naturalWidth}×${c.naturalHeight}`); c.onerror=()=>set('c',false,'new Image absolute onerror'); c.src=abs;
fetch(abs,{cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);const blob=await r.blob();set('d',true,`HTTP ${r.status}; ${blob.type}; ${blob.size} bytes`)}).catch(err=>set('d',false,String(err)));
const files=['high1.png','high2.png','high3.png','high4.png','high5.png','high6.png','low1.png','low2.png','low3.png','low4.png','low5.png','low6.png','test.png'];
document.getElementById('runJs').onclick=()=>{
 try {
   const diagJsPsych=initJsPsych({display_element:'jspsych-diag-target',on_finish:()=>{const r=diagJsPsych.data.get().last(1).values()[0]||{};set('f',!!r.success,`success=${r.success}; failed_images=${JSON.stringify(r.failed_images||[])}`);}});
   diagJsPsych.run([{type:jsPsychPreload,images:[abs],continue_after_error:true,show_progress_bar:true,data:{kind:'diag'}}]);
 } catch(err){set('f',false,String(err));}
};

document.getElementById('run13').onclick=()=>{
 let done=0,ok=0,failed=[]; const t0=performance.now(); const e=document.getElementById('e'); e.className='wait';e.textContent='0/13';
 files.forEach(name=>{const im=new Image(); const src='img/'+name; im.onload=finish.bind(null,true,name); im.onerror=finish.bind(null,false,name); im.src=src;});
 function finish(success,name){done++; if(success)ok++; else failed.push(name); e.textContent=`${done}/13（成功 ${ok}，失败 ${failed.length}）`; if(done===13){const ms=Math.round(performance.now()-t0);e.className=failed.length?'bad':'ok';e.textContent=`完成：成功 ${ok}/13，失败 ${failed.length}/13，耗时 ${ms} ms`+(failed.length?`；失败：${failed.join(', ')}`:'');}}
};
</script>
</body>
</html>
