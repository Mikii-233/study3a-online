<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>智能驾驶体验</title>
    <script src="jspsych/jspsych.js"></script>
    <script src="plugins/plugin-html-keyboard-response.js"></script>
    <link rel="stylesheet" href="jspsych/jspsych.css">

    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #e0e0e0;
            font-family: 'Microsoft YaHei', sans-serif;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #jspsych-target { width: 100%; min-height: 100dvh; }
        .jspsych-display-element {
            background-color: #1e1e24;
            color: #e0e0e0;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .jspsych-content-wrapper {
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100dvh;
            height: auto;
            padding: 0;
            box-sizing: border-box;
        }
        .jspsych-content { width: 100%; max-width: none; }
        .hidden { display: none !important; }
        .fullscreen-container {
            width: 100%;
            min-height: 100dvh;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 18px 0;
            overflow: visible;
        }
        .highlight-text { color: #ffb74d; font-weight: bold; }
        .ready-text { color: #4CAF50; font-weight: bold; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 登录 */
        .login-box {
            background-color: #2b2b36;
            padding: 50px;
            border-radius: 12px;
            border: 1px solid #444;
            text-align: center;
        }
        .login-title { font-size: 32px; color: #64b5f6; margin-bottom: 30px; font-weight: bold; }
        .login-input {
            font-size: 28px;
            padding: 10px;
            width: 220px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #64b5f6;
            background-color: #15151a;
            color: white;
            margin-bottom: 30px;
            outline: none;
        }
        .login-btn, .action-btn {
            font-size: 22px;
            padding: 12px 34px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .login-btn:hover, .action-btn:hover { filter: brightness(1.08); }

        /* 通用指导语 */
        .guide-box {
            background-color: #2b2b36;
            padding: 38px 56px;
            border-radius: 12px;
            border: 1px solid #444;
            width: min(900px, 88vw);
            line-height: 1.8;
            font-size: 21px;
            text-align: left;
            box-sizing: border-box;
        }
        .guide-box.center-guide { text-align: left; }
        .guide-box.center-guide .context-box { text-align: left; }
        .guide-box.center-guide .guide-rules { text-align: left; }
        .guide-title {
            font-size: 34px;
            color: #64b5f6;
            margin-bottom: 26px;
            font-weight: bold;
            text-align: center;
        }
        .footer-hint { margin-top: 32px; text-align: center; font-size: 20px; color: #9e9e9e; height: 30px; }
        .context-box {
            background-color: #383846;
            padding: 18px 26px;
            border-left: 5px solid #ffb74d;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 19px;
        }
        .key-hint-box {
            background-color: #15151a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
            font-size: 19px;
            margin-top: 15px;
            color: #b0bec5;
        }

        /* 概念学习 */
        .concept-cards { display: flex; gap: 20px; width: min(1000px, 92vw); margin-bottom: 18px; }
        .concept-card {
            flex: 1;
            background-color: #383846;
            border-radius: 8px;
            padding: 20px;
            border-top: 4px solid #64b5f6;
        }
        .concept-card.warmth { border-top-color: #ffb74d; }
        .concept-card h3 { margin-top: 0; color: #e0e0e0; border-bottom: 1px solid #555; padding-bottom: 10px; font-size: 20px; }
        .concept-card p { font-size: 16px; color: #b0bec5; line-height: 1.6; }
        .quiz-section {
            background-color: #15151a;
            border: 1px solid #444;
            padding: 22px 36px;
            border-radius: 8px;
            width: min(920px, 88vw);
            font-size: 19px;
            margin-top: 28px;
            text-align: left;
            box-sizing: border-box;
        }

        /* 人口学 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 24px;
            margin-top: 20px;
        }
        .form-item {
            background-color: #15151a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px;
        }
        .form-item label { display: block; margin-bottom: 10px; color: #b0bec5; font-size: 17px; }
        .form-item input, .form-item select {
            width: 100%;
            box-sizing: border-box;
            background-color: #2b2b36;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            font-size: 18px;
            outline: none;
        }
        .warn-text { text-align: center; color: #ff5252; font-size: 18px; margin-top: 16px; min-height: 24px; font-weight: bold; }

        /* 基线点数分配 */
        .allocation-wrap {
            display: flex;
            gap: 34px;
            justify-content: center;
            align-items: stretch;
            margin: 24px 0;
        }
        .allocation-card {
            width: 320px;
            padding: 24px;
            background-color: #15151a;
            border: 1px solid #444;
            border-radius: 10px;
            text-align: center;
        }
        .allocation-card.comp { border-top: 5px solid #4CAF50; }
        .allocation-card.warm { border-top: 5px solid #FF9800; }
        .allocation-score { font-size: 54px; font-weight: bold; margin: 16px 0; }
        .allocation-controls { display: flex; justify-content: center; gap: 18px; }
        .mini-btn {
            width: 54px;
            height: 44px;
            font-size: 26px;
            border-radius: 8px;
            border: 1px solid #666;
            background-color: #383846;
            color: #fff;
            cursor: pointer;
        }

        /* 四种助手介绍卡 */
        .assistant-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            width: min(1100px, 92vw);
        }
        .assistant-card {
            background-color: #2b2b36;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px 24px;
            box-sizing: border-box;
        }
        .assistant-card-title { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 14px; color: #fff; }
        .mini-dim-row { display: flex; align-items: center; justify-content:center; gap: 14px; margin: 12px 0; }
        .mini-dim-label { width: 110px; font-size: 18px; font-weight: bold; white-space:nowrap; }
        .mini-bars { display: flex; gap: 10px; }
        .mini-bar { width: 54px; height: 20px; border: 2px solid #777; border-radius: 5px; background-color: rgba(255,255,255,0.04); }
        .mini-bar.comp.on { background-color: #4CAF50; border-color: #4CAF50; box-shadow: 0 0 8px rgba(76,175,80,0.35); }
        .mini-bar.warm.on { background-color: #FF9800; border-color: #FF9800; box-shadow: 0 0 8px rgba(255,152,0,0.35); }

        /* 正式试验矩阵：沿用3b的两列结构 */
        .matrix-shell {
            display: flex;
            width: min(1200px, 94vw);
            justify-content: space-between;
            align-items: flex-start;
            margin: 0 auto;
        }
        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50%;
            box-sizing: border-box;
        }
        .panel-title {
            font-size: clamp(20px, 1.45vw, 27px);
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 2px;
            text-align: center;
        }
        .attr-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }
        .attr-name {
            font-size: clamp(15px, 1.05vw, 20px);
            color: #b0bec5;
            margin-bottom: 5px;
            text-align: center;
            font-weight: bold;
        }
        .block-container { display: flex; gap: clamp(10px, 1vw, 18px); justify-content: center; }
        .block {
            width: clamp(42px, 3.5vw, 62px);
            height: clamp(15px, 1.35vw, 24px);
            border-radius: 6px;
            border: 2px solid #777;
            box-sizing: border-box;
        }
        .block-filled-comp { background-color: #4CAF50; border-color: #4CAF50; box-shadow: 0 0 10px rgba(76,175,80,0.35); }
        .block-filled-warm { background-color: #FF9800; border-color: #FF9800; box-shadow: 0 0 10px rgba(255,152,0,0.35); }
        .block-empty { background-color: rgba(255,255,255,0.04); }

        /* 试次下方评分区 */
        .rating-question { font-size: clamp(19px, 1.45vw, 27px); font-weight: bold; color: #f0f0f0; margin-bottom: 14px; text-align: center; }
        .rating-scale {
            display: flex;
            justify-content: space-between;
            width: min(1000px, 90vw);
            font-size: clamp(14px, 1vw, 18px);
            color: #64b5f6;
            font-weight: bold;
        }
        .rating-choice { margin-top: 12px; font-size: clamp(18px, 1.25vw, 23px); color: #4CAF50; font-weight: bold; text-align: center; }
        .rating-hint { margin-top: 8px; color: #ffb74d; font-size: clamp(14px, 1vw, 18px); text-align: center; }
        .assistant-badge {
            position: static;
            transform: none;
            padding: 5px 18px;
            background-color: #15151a;
            border: 1px solid #555;
            border-radius: 999px;
            font-size: clamp(14px, 1vw, 18px);
            color: #d7d7d7;
            z-index: 3;
            flex: 0 0 auto;
        }


        /* ===== 在线/触屏版补充样式 ===== */
        button, input { touch-action: manipulation; }
        .continue-btn {
            min-width: 180px;
            min-height: 52px;
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            background: #4CAF50;
            color: #fff;
            cursor: pointer;
        }
        .continue-btn:disabled { opacity: .45; cursor: not-allowed; }
        .quiz-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
        }
        .quiz-option {
            min-height: 54px;
            padding: 10px 12px;
            border-radius: 9px;
            border: 1px solid #666;
            background: #2b2b36;
            color: #f0f0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .quiz-option.selected { border-color:#64b5f6; box-shadow:0 0 0 2px rgba(100,181,246,.25) inset; }
        .quiz-option.correct { border-color:#4CAF50; background:rgba(76,175,80,.18); }
        .quiz-option.wrong { border-color:#ff7043; background:rgba(255,112,67,.14); }
        .level-legend {
            width:min(1080px,92vw);
            background:#15151a;
            border:1px solid #444;
            border-radius:10px;
            padding:16px 22px;
            box-sizing:border-box;
            margin:0 auto 18px;
            line-height:1.7;
            font-size:17px;
            color:#c9c9c9;
        }
        .legend-levels {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:12px;
            margin-top:12px;
        }
        .legend-level {
            background:#2b2b36;
            border:1px solid #4b4b56;
            border-radius:8px;
            padding:10px;
            text-align:center;
        }
        .legend-bars {
            display:flex;
            justify-content:center;
            gap:7px;
            margin-bottom:7px;
        }
        .legend-bar {
            width:34px;
            height:13px;
            border:1.5px solid #777;
            border-radius:4px;
            background:rgba(255,255,255,.04);
            box-sizing:border-box;
        }
        .legend-bar.on {
            background:#64b5f6;
            border-color:#64b5f6;
            box-shadow:0 0 7px rgba(100,181,246,.28);
        }
        .assistant-note { color:#aeb7c2; font-size:15px; line-height:1.55; margin-top:10px; text-align:center; }
        .assistant-profile { color:#ffcf8a; font-size:16px; line-height:1.4; margin:2px 0 12px; text-align:center; font-weight:bold; }
        .rating-back { position:absolute; top:5px; right:10px; border:1px solid #666; border-radius:7px; background:#1f2028; color:#c8d2dc; padding:4px 9px; font-size:12px; cursor:pointer; }
        .rating-back.hidden { display:none; }
        .rating-options {
            display:grid;
            grid-template-columns:repeat(5, 1fr);
            gap:14px;
            width:min(760px,90vw);
            margin-top:8px;
        }
        .rating-option {
            min-height:54px;
            padding:6px 8px;
            border-radius:10px;
            border:2px solid #59616d;
            background:#1f2028;
            color:#64b5f6;
            font-size:24px;
            font-weight:bold;
            cursor:pointer;
        }
        .rating-anchors {
            width:min(760px,90vw);
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            margin-top:4px;
            color:#b7c5d3;
            font-size:15px;
        }
        .rating-anchors span:nth-child(1){text-align:left;}
        .rating-anchors span:nth-child(2){text-align:center;}
        .rating-anchors span:nth-child(3){text-align:right;}
        .rating-option.selected {
            border-color:#4CAF50;
            background:rgba(76,175,80,.16);
            box-shadow:0 0 0 2px rgba(76,175,80,.15) inset;
        }
        .rating-confirm {
            margin-top:10px;
            min-width:150px;
            min-height:44px;
            padding:8px 22px;
            border:0;
            border-radius:9px;
            background:#4CAF50;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
        }
        .rating-confirm:disabled { opacity:.4; cursor:not-allowed; }
        .rating-zone { position:relative; }
        .rating-progress {
            position:absolute;
            top:6px;
            left:12px;
            font-size:14px;
            color:#9e9e9e;
            margin:0;
        }
        .trial-shell { display:flex; flex-direction:column; height:100dvh; min-height:100dvh; width:100%; overflow:hidden; box-sizing:border-box; }
        .device-note { font-size:14px; color:#8e98a5; text-align:center; margin-top:10px; }

        @media (max-width: 900px) {
            .guide-box { width:94vw; padding:24px 24px; font-size:18px; }
            .guide-title { font-size:27px; margin-bottom:18px; }
            .concept-cards { width:94vw; gap:12px; }
            .concept-card { padding:14px; }
            .concept-card h3 { font-size:17px; }
            .concept-card p { font-size:14px; }
            .assistant-grid { width:94vw; gap:12px; }
            .assistant-card { padding:14px; }
            .assistant-card-title { font-size:20px; }
            .mini-dim-label { width:84px; font-size:15px; }
            .mini-bar { width:34px; height:17px; }
            .allocation-wrap { gap:14px; }
            .allocation-card { width:min(300px,42vw); padding:16px; }
            .rating-options { gap:8px; grid-template-columns:repeat(5, 1fr); width:92vw; }
            .rating-option { min-width:0; min-height:50px; padding:4px; font-size:22px; }
            .rating-anchors { width:92vw; font-size:13px; }
            .matrix-shell { width:98vw; }
            .block { width:clamp(28px,7vw,48px); height:18px; }
            .block-container { gap:6px; }
            .attr-name { font-size:14px; }
            .panel-title { font-size:18px; }
        }
        @media (max-width: 650px) {
            /* 手机端以竖屏为主：页面本身可滚动，但不再使用卡片内部的嵌套滚动。 */
            html, body, #jspsych-target, .jspsych-display-element {
                min-height: 100svh;
                overscroll-behavior-y: contain;
            }
            .jspsych-content-wrapper {
                min-height: 100svh;
                height: auto;
                align-items: flex-start;
            }
            .fullscreen-container {
                width: 100%;
                min-height: 100svh;
                height: auto;
                justify-content: flex-start;
                padding: 12px 0 calc(18px + env(safe-area-inset-bottom));
                overflow: visible;
            }
            #login-screen.fullscreen-container {
                min-height: 100svh;
                justify-content: center;
                padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
            }
            .login-box {
                width: 90vw;
                padding: 24px 18px;
                box-sizing: border-box;
            }
            .login-title { font-size: 25px; margin-bottom: 16px; }
            .login-input { width: 72vw; max-width: 260px; font-size: 23px; margin-bottom: 18px; }
            .login-btn, .action-btn, .continue-btn {
                min-height: 44px;
                padding: 9px 18px;
                font-size: 16px;
                border-radius: 9px;
            }
            .guide-box {
                width: 92vw;
                padding: 16px 15px;
                font-size: 15.5px;
                line-height: 1.55;
            }
            .guide-title {
                font-size: 23px;
                line-height: 1.25;
                margin-bottom: 11px;
            }
            .context-box {
                padding: 11px 13px;
                margin-bottom: 11px;
                font-size: 14.5px;
                line-height: 1.5;
            }
            .key-hint-box { padding:10px; font-size:14px; margin-top:10px; }
            .footer-hint { margin-top:14px; height:auto; font-size:15px; }

            /* 概念学习：三张卡片全部直接呈现，不在卡片区内滚动。 */
            .concept-cards {
                width: 92vw;
                flex-direction: column;
                gap: 19px;
                margin-bottom: 12px;
                max-height: none;
                overflow: visible;
            }
            .concept-card {
                padding: 8px 11px;
                border-top-width: 3px;
            }
            .concept-card h3 {
                font-size: 15px;
                line-height: 1.3;
                margin: 0 0 4px;
                padding-bottom: 4px;
            }
            .concept-card p {
                font-size: 13px;
                line-height: 1.4;
                margin: 0;
            }
            .quiz-section {
                width: 92vw;
                padding: 11px 12px;
                margin-top: 5px;
                font-size: 14px;
                line-height: 1.45;
            }
            .quiz-options {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                margin-top: 10px;
            }
            .quiz-option {
                min-height: 42px;
                padding: 6px 4px;
                font-size: 13px;
                line-height: 1.25;
            }
            .warn-text { font-size:13px; margin-top:8px; min-height:18px; }

            /* 10点分配：手机竖屏仍保持左右并列，避免无意义的纵向滚动。 */
            .allocation-wrap {
                flex-direction: row;
                align-items: stretch;
                gap: 8px;
                margin: 13px 0;
                max-height: none;
                overflow: visible;
                width: 100%;
            }
            .allocation-card {
                width: calc(50% - 4px);
                padding: 11px 7px;
            }
            .allocation-score { font-size:38px; margin:8px 0; }
            .allocation-controls { gap:8px; }
            .mini-btn { width:46px; height:40px; font-size:22px; }

            /* 四助手学习：2×2矩阵一次看全；不再使用单列+内部滚动。 */
            .level-legend {
                width: 92vw;
                padding: 9px 11px;
                margin-bottom: 8px;
                font-size: 13px;
                line-height: 1.45;
            }
            .legend-levels {
                grid-template-columns: repeat(3,1fr);
                gap: 5px;
                margin-top: 7px;
            }
            .legend-level { padding:6px 3px; font-size:12px; }
            .legend-bars { gap:3px; margin-bottom:4px; }
            .legend-bar { width:18px; height:8px; border-width:1px; }
            .assistant-grid {
                grid-template-columns: 1fr 1fr;
                width: 92vw;
                gap: 7px;
                max-height: none;
                overflow: visible;
            }
            .assistant-card { padding: 9px 7px; border-radius:9px; }
            .assistant-card-title { font-size:16px; margin-bottom:7px; }
            .mini-dim-row { gap:5px; margin:6px 0; }
            .mini-dim-label { width:58px; font-size:12px; white-space:nowrap; flex:0 0 auto; }
            .mini-bars { gap:3px; flex:0 0 auto; }
            .mini-bar { width:20px; height:11px; border-width:1.5px; border-radius:3px; }
            .assistant-note { font-size:11.5px; line-height:1.35; margin-top:4px; }

            /* 正式/练习 Trial：固定竖屏结构；正常尺寸下无需滚动，极小屏幕仍允许整页向下滑。 */
            .trial-shell {
                height: 100svh;
                min-height: 100svh;
                width: 100%;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: contain;
                padding-bottom: env(safe-area-inset-bottom);
            }
            .trial-shell > div:nth-child(1) {
                flex: 0 0 10% !important;
                min-height: 62px;
                padding: 5px 11px !important;
                font-size: 13px !important;
                line-height: 1.32 !important;
                overflow: visible !important;
            }
            .trial-shell > div:nth-child(2) {
                flex: 0 0 30% !important;
                min-height: 170px;
                padding: 4px 0 !important;
                overflow: hidden;
            }
            .trial-shell > div:nth-child(2) img {
                width: 96% !important;

<body>
    <div id="login-screen" class="fullscreen-container">
        <div class="login-box">
            <div class="login-title">输入实验编号</div>
            <div style="color:#b0bec5;font-size:16px;line-height:1.6;margin-bottom:18px;max-width:420px;">请输入您在前置问卷中使用的被试编号，以便匹配两部分数据。请勿填写姓名、手机号等个人信息。</div>
            <input type="text" id="subject-id-input" class="login-input" placeholder="例如：001" inputmode="numeric" maxlength="30" autocomplete="off"><br>
            <button class="login-btn" onclick="startExperiment()">进入体验</button>
        </div>
    </div>

    <div id="jspsych-target"></div>

<script>
    /* =========================================================
       1. 全局变量与材料
       ========================================================= */
    let currentSubjectId = "";
    let versionIndex = 0;
    let spatialLayout = "CompLeft";
    let currentVersion = "";
    let baselineAbility = null;
    let baselineEmotion = null;

    /* =========================================================
       DataPipe / OSF 在线数据回收配置
       =========================================================
       1) 在 https://pipe.jspsych.org 创建实验后，将实验 ID 填到下方。
       2) DataPipe 后台将 Condition assignment 设置为 4 个条件。
          条件 0 = 顺序A × 能力左
          条件 1 = 顺序A × 情感左
          条件 2 = 顺序B × 能力左
          条件 3 = 顺序B × 情感左
       3) 正式收集时 DATAPIPE_REQUIRED 保持 true；若分配/上传失败，实验不会静默继续。
    */
    const DATAPIPE_EXPERIMENT_ID = 'kYthZed2dSW4';
    const DATAPIPE_REQUIRED = true;
    const DATAPIPE_BASE = 'https://pipe.jspsych.org/api';

    let dataPipeCondition = null;
    let sessionUUID = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `fallback-${Date.now()}-${Math.random().toString(16).slice(2)}`;

    function dataPipeConfigured() {
        return DATAPIPE_EXPERIMENT_ID && !DATAPIPE_EXPERIMENT_ID.startsWith('REPLACE_');
    }

    async function getDataPipeCondition() {
        if (!dataPipeConfigured()) {
            throw new Error('DataPipe experiment ID 尚未配置。');
        }
        const response = await fetch(`${DATAPIPE_BASE}/condition/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ experimentID: DATAPIPE_EXPERIMENT_ID })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || typeof result.condition !== 'number') {
            throw new Error(result.message || `DataPipe 条件分配失败（HTTP ${response.status}）`);
        }
        return result.condition;
    }

    function pad2(n) { return String(n).padStart(2, '0'); }
    function pad3(n) { return String(n).padStart(3, '0'); }

    function formatLocalTimestamp(date = new Date()) {
        return `${date.getFullYear()}${pad2(date.getMonth()+1)}${pad2(date.getDate())}_${pad2(date.getHours())}${pad2(date.getMinutes())}${pad2(date.getSeconds())}_${pad3(date.getMilliseconds())}`;
    }

    function buildUniqueDataFilename() {
        const safeSubject = String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g, '_');
        return `${formatLocalTimestamp(new Date())}_Subject${safeSubject}.csv`;
    }

    const CLEAN_CSV_COLUMNS = [
        'Subject_ID','DataPipe_Condition','Sequence','Spatial_Layout','Formal_Trial_Order',
        'Block','Block_Position','Image_Number','Image_ID','Image_File','Scene_ID','Risk_Level',
        'Assistant_Label','Config_Code','Config_Type','Config_Name_CN','Ability_Level','Emotion_Level',
        'Trust_Score','Trust_RT_ms','Cooperation_Score','Cooperation_RT_ms','Back_to_Q1_Count','Total_Trial_Time_ms',
        'Baseline_Ability_Points','Baseline_Emotion_Points'
    ];

    function csvEscape(value) {
        if (value === null || value === undefined) return '';
        const s = String(value);
        return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function buildCleanFormalCSV() {
        const rows = jsPsych.data.get().filter({Event_Type:'Formal_Trial'}).values();
        const lines = [CLEAN_CSV_COLUMNS.join(',')];
        rows.forEach(row => {
            lines.push(CLEAN_CSV_COLUMNS.map(col => csvEscape(row[col])).join(','));
        });
        return lines.join('\r\n');
    }

    async function uploadFinalDataToDataPipe(csvString) {
        if (!dataPipeConfigured()) {
            throw new Error('DataPipe experiment ID 尚未配置。');
        }
        const filename = buildUniqueDataFilename();
        const response = await fetch(`${DATAPIPE_BASE}/data/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                experimentID: DATAPIPE_EXPERIMENT_ID,
                filename: filename,
                data: csvString
            })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.message !== 'Success') {
            throw new Error(result.message || `DataPipe 数据上传失败（HTTP ${response.status}）`);
        }
        return { filename, result };
    }

    function prepareLocalBackup(csvString) {
        window.downloadCSV = function() {
            const fileName = `BACKUP_${formatLocalTimestamp(new Date())}_Subject${String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g,'_')}.csv`;
            const blob = new Blob([csvString.startsWith("\uFEFF") ? csvString : "\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    }

    const txt1 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正行驶在公路上，此时，侧方有一辆车准备汇入我们所在的车道…";
    const txt2 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正沿着道路向前行驶，此时，前方路面出现了施工区域和路障…";
    const txt3 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆即将进入居民区，正在驶向路口…";
    const txt4 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正准备通过前方的十字路口，此时，前方交通状况发生了变化…";
    const txt5 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正准备驶入弯道区域…";
    const txt6 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆即将抵达目的地，准备寻找合适的空车位停车…";
    const sceneText = {1: txt1, 2: txt2, 3: txt3, 4: txt4, 5: txt5, 6: txt6};

    /* 正式材料列表。
       手机端不再依赖 jsPsychPreload：改为同源绝对 URL + 顺序 fetch + 自动重试。
       这样既避免一次并发请求 13 张大图，也绕开部分移动浏览器对 preload 插件的兼容问题。 */
    const ALL_IMAGES = [
        'img/high1.png','img/high2.png','img/high3.png','img/high4.png','img/high5.png','img/high6.png',
        'img/low1.png','img/low2.png','img/low3.png','img/low4.png','img/low5.png','img/low6.png',
        'img/test.png'
    ];

    function assetUrl(path) {
        return new URL(path, document.baseURI).href;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchWithTimeout(url, timeoutMs = 18000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, {
                method: 'GET',
                cache: 'force-cache',
                credentials: 'same-origin',
                signal: controller.signal
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            // 读取完整响应，确保图片内容已经真正进入浏览器缓存。
            await response.blob();
            return true;
        } finally {
            clearTimeout(timer);
        }
    }

    async function robustPreloadImages(paths, onProgress) {
        const total = paths.length;
        for (let i = 0; i < total; i++) {
            const path = paths[i];
            const url = assetUrl(path);
            let lastError = null;

            // 单张图片最多尝试 3 次；顺序加载，减轻手机浏览器瞬时并发压力。
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    if (onProgress) onProgress(i, total, path, attempt, false);
                    await fetchWithTimeout(url);
                    lastError = null;
                    break;
                } catch (error) {
                    lastError = error;
                    if (attempt < 3) await sleep(500 * attempt);
                }
            }

            if (lastError) {
                throw new Error(`资源加载失败：${path}（${lastError.message || lastError}）`);
            }

            if (onProgress) onProgress(i + 1, total, path, 0, true);
        }
        return true;
    }

    function showResourceLoader() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('jspsych-target').innerHTML = `
            <div class="fullscreen-container">
                <div class="guide-box" style="max-width:620px;text-align:center;">
                    <div class="guide-title">正在准备驾驶场景</div>
                    <div id="resource-load-text" style="color:#c7d0da;font-size:16px;line-height:1.6;margin-bottom:16px;">正在连接并加载场景图片，请稍候…</div>
                    <div style="width:100%;height:12px;background:#15151a;border:1px solid #4b4b56;border-radius:999px;overflow:hidden;box-sizing:border-box;">
                        <div id="resource-load-bar" style="width:0%;height:100%;background:#4CAF50;transition:width .2s ease;"></div>
                    </div>
                    <div id="resource-load-count" style="margin-top:10px;color:#8e98a5;font-size:14px;">0 / ${ALL_IMAGES.length}</div>
                </div>
            </div>`;
    }

    function updateResourceLoader(done, total, path, attempt, success) {
        const bar = document.getElementById('resource-load-bar');
        const text = document.getElementById('resource-load-text');
        const count = document.getElementById('resource-load-count');
        if (bar) bar.style.width = `${Math.round((done / total) * 100)}%`;
        if (count) count.textContent = `${done} / ${total}`;
        if (text) {
            if (success) text.textContent = '正在准备驾驶场景，请稍候…';
            else text.textContent = attempt > 1 ? `网络较慢，正在重新加载场景资源（第 ${attempt} 次尝试）…` : '正在准备驾驶场景，请稍候…';
        }
    }

    function showResourceLoadError(error) {
        document.getElementById('jspsych-target').innerHTML = `
            <div class="fullscreen-container">
                <div class="guide-box" style="max-width:700px;text-align:left;">
                    <div class="guide-title" style="color:#ff7043;">驾驶场景暂未加载成功</div>
                    <div class="context-box" style="text-align:left;">当前网络未能完整加载实验资源。请确认网络连接正常后重新尝试。</div>
                    <div style="color:#ffb74d;font-size:14px;line-height:1.6;word-break:break-all;margin-bottom:18px;">${String(error.message || error)}</div>
                    <div style="text-align:center;"><button id="resource-retry" class="continue-btn">重新加载</button></div>
                </div>
            </div>`;
        document.getElementById('resource-retry').addEventListener('click', () => {
            document.getElementById('jspsych-target').innerHTML = '';
            document.getElementById('login-screen').classList.remove('hidden');
            const btn = document.querySelector('.login-btn');
            if (btn) { btn.disabled = false; btn.innerText = '进入体验'; }
        });
    }

    /* 四种实验条件。level=1/2/3分别表示该大类属性的低/中/高配置。
       正式界面中，三个能力层级共享abilityLevel，三个情感层级共享emotionLevel。 */
    const CONFIGS = [
        { key: 'AbilityOriented', internalName: '能力导向型', abilityLevel: 3, emotionLevel: 1 },
        { key: 'EmotionOriented', internalName: '情感导向型', abilityLevel: 1, emotionLevel: 3 },
        { key: 'BalancedBaseline', internalName: '均衡基线型', abilityLevel: 2, emotionLevel: 2 },
        { key: 'LowLow', internalName: '双低配置型', abilityLevel: 1, emotionLevel: 1 }
    ];

    /* 四个助手固定对应唯一配置，不随版本改变。
       A=能力导向(3/1)，B=情感导向(1/3)，C=均衡基线(2/2)，D=双低(1/1)。 */
    let assistantLabelMap = {};
    let configToLabel = {};

    /* 12个驾驶刺激：6种场景 × 高/低风险，各1张。
       顺序沿用3b中已经人为拉开同类场景距离的排列。 */
    const BASE_STIMULI = [
        { image:'high1.png', risk:'High', scene:1 },
        { image:'low2.png',  risk:'Low',  scene:2 },
        { image:'high3.png', risk:'High', scene:3 },
        { image:'low4.png',  risk:'Low',  scene:4 },
        { image:'low5.png',  risk:'Low',  scene:5 },
        { image:'high6.png', risk:'High', scene:6 },
        { image:'high2.png', risk:'High', scene:2 },
        { image:'low3.png',  risk:'Low',  scene:3 },
        { image:'low1.png',  risk:'Low',  scene:1 },
        { image:'high4.png', risk:'High', scene:4 },
        { image:'high5.png', risk:'High', scene:5 },
        { image:'low6.png',  risk:'Low',  scene:6 }
    ].map((x, i) => ({...x, stimIndex:i, text:sceneText[x.scene]}));

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target',
        on_finish: async function() {
            const rawCleanCsv = buildCleanFormalCSV();
            const csvString = "\uFEFF" + rawCleanCsv;
            prepareLocalBackup(csvString);

            document.getElementById('jspsych-target').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background-color:#1e1e24;min-height:100vh;color:white;box-sizing:border-box;">
                    <div style="max-width:760px;">
                        <h2 style="color:#64b5f6;">体验已完成，正在提交数据……</h2>
                        <p style="color:#bbb;line-height:1.8;">请暂时不要关闭、刷新或返回此页面。数据成功保存到研究数据库后会自动显示确认信息。</p>
                    </div>
                </div>`;

            try {
                const upload = await uploadFinalDataToDataPipe(csvString);
                document.getElementById('jspsych-target').innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background-color:#1e1e24;min-height:100vh;color:white;box-sizing:border-box;">
                        <div style="max-width:760px;">
                            <h2 style="color:#4CAF50;">✓ 数据提交成功</h2>
                            <p style="color:#ddd;line-height:1.8;">本次体验已全部结束，感谢您的参与！现在可以安全关闭此页面。</p>
                            <p style="color:#777;font-size:14px;">数据文件：${upload.filename}</p>
                        </div>
                    </div>`;
                console.log('DataPipe upload success:', upload.filename);
            } catch (error) {
                console.error('DataPipe upload failed:', error);
                document.getElementById('jspsych-target').innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background-color:#1e1e24;min-height:100vh;color:white;box-sizing:border-box;">
                        <div style="max-width:820px;">
                            <h2 style="color:#ff7043;">数据暂未成功上传</h2>
                            <p style="color:#ddd;line-height:1.8;">请不要直接关闭页面。您可以先检查网络并刷新后重新完成实验；如研究者允许，也可点击下方按钮保存本地备份文件并联系研究者。</p>
                            <p style="color:#ffb74d;font-size:15px;word-break:break-all;">错误信息：${String(error.message || error)}</p>
                            <button onclick="downloadCSV()" style="padding:12px 24px;font-size:18px;background-color:#64b5f6;color:#111;border:none;border-radius:8px;cursor:pointer;">保存本地备份 CSV</button>
                            <p style="color:#777;font-size:14px;margin-top:20px;">会话编号：${sessionUUID}</p>
                        </div>
                    </div>`;
            }
        }
    });

    function rotateArray(arr, shift) {
        const n = arr.length;
        const s = ((shift % n) + n) % n;
        return arr.slice(s).concat(arr.slice(0, s));
    }

    function setupAssistantLabels() {
        assistantLabelMap = {
            A: CONFIGS[0],
            B: CONFIGS[1],
            C: CONFIGS[2],
            D: CONFIGS[3]
        };
        configToLabel = {
            AbilityOriented: 'A',
            EmotionOriented: 'B',
            BalancedBaseline: 'C',
            LowLow: 'D'
        };
    }

    /* 48个正式试次 = 12个驾驶刺激 × 4种助手配置。
       每个刺激在4个block中恰好与4种助手各配对1次；每个block中四种助手各出现3次。
       这样对每名被试均完整覆盖4助手×2风险，并用A/B顺序版本轮换初始配对关系。 */
    function buildFormalTrials() {
        let all = [];
        for (let b = 0; b < 4; b++) {
            let blockOrder = rotateArray(BASE_STIMULI, (versionIndex * 2 + b * 3) % BASE_STIMULI.length);
            if (b % 2 === 1) blockOrder = blockOrder.slice().reverse();

            blockOrder.forEach((stim, displayPos) => {
                const cfgIndex = (stim.stimIndex + b + versionIndex) % 4;
                const cfg = CONFIGS[cfgIndex];
                all.push({
                    ...stim,
                    block: b + 1,
                    blockPosition: displayPos + 1,
                    config: cfg,
                    assistantLabel: configToLabel[cfg.key]
                });
            });
        }
        return all.map((trial, idx) => ({...trial, formalTrialOrder: idx + 1}));
    }

    function makeBars(level, type, small=false) {
        let html = '';
        for (let i=1; i<=3; i++) {
            if (small) {
                html += `<div class="mini-bar ${type} ${i <= level ? 'on' : ''}"></div>`;
            } else {
                const cls = i <= level ? (type === 'comp' ? 'block-filled-comp' : 'block-filled-warm') : 'block-empty';
                html += `<div class="block ${cls}"></div>`;
            }
        }
        return html;
    }

    function renderMatrix(config, layout) {
        const compHTML = `
            <div class="panel">
                <div class="panel-title">能力属性</div>
                <div class="attr-group"><div class="attr-name">感知功能</div><div class="block-container">${makeBars(config.abilityLevel,'comp')}</div></div>
                <div class="attr-group"><div class="attr-name">预测功能</div><div class="block-container">${makeBars(config.abilityLevel,'comp')}</div></div>
                <div class="attr-group"><div class="attr-name">执行功能</div><div class="block-container">${makeBars(config.abilityLevel,'comp')}</div></div>
            </div>`;
        const warmHTML = `
            <div class="panel">
                <div class="panel-title">情感属性</div>
                <div class="attr-group"><div class="attr-name">觉察功能</div><div class="block-container">${makeBars(config.emotionLevel,'warm')}</div></div>
                <div class="attr-group"><div class="attr-name">共情功能</div><div class="block-container">${makeBars(config.emotionLevel,'warm')}</div></div>
                <div class="attr-group"><div class="attr-name">调节功能</div><div class="block-container">${makeBars(config.emotionLevel,'warm')}</div></div>
            </div>`;
        return layout === 'CompLeft' ? compHTML + warmHTML : warmHTML + compHTML;
    }

    function levelText(level) {
        return level === 1 ? '低水平' : (level === 2 ? '标准水平' : '高水平');
    }

    function makeAssistantCard(label) {
        const cfg = assistantLabelMap[label];

    function createRatingTrialNode(trialData, isFormal=true) {
        const matrixHTML = renderMatrix(trialData.config, spatialLayout);
        const assistantDisplay = isFormal ? `本路段由智驾助手 ${trialData.assistantLabel} 负责驾驶` : '本路段由练习助手负责驾驶';

        const question2 = '在当前路况下，我愿意选择这款智驾助手完成这段行程';
        const ratingButtons = [1,2,3,4,5].map(score => `<button class="rating-option" data-score="${score}">${score}</button>`).join('');

        return {
            type: jsPsychHtmlKeyboardResponse,
            choices: 'NO_KEYS',
            stimulus: `
            <div class="trial-shell">
                <div style="flex:0 0 10%;width:100%;display:flex;align-items:center;justify-content:flex-start;background:#15151a;font-size:clamp(16px,1.35vw,26px);font-weight:bold;color:#fff;padding:0 clamp(16px,4vw,55px);box-sizing:border-box;border-bottom:2px solid #333;overflow:hidden;">
                    <span style="display:block;width:100%;line-height:1.4;">${trialData.text}</span>
                </div>

                <div style="flex:0 0 35%;width:100%;display:flex;justify-content:center;align-items:center;background:#15151a;box-sizing:border-box;padding:8px 0;">
                    <img src="${assetUrl(`img/${trialData.image}`)}" style="height:100%;width:auto;max-width:95%;object-fit:contain;border-radius:8px;display:block;box-shadow:0 4px 15px rgba(0,0,0,0.5);">
                </div>

                <div style="flex:0 0 30%;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;background:#1e1e24;box-sizing:border-box;border-top:2px solid #333;border-bottom:2px solid #444;padding:7px 0 4px;">
                    <div class="assistant-badge">${assistantDisplay}</div>
                    <div class="matrix-shell">${matrixHTML}</div>
                </div>

                <div class="rating-zone" style="flex:0 0 25%;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#2b2b36;box-sizing:border-box;padding:20px 12px 6px;overflow:hidden;">
                    <div id="rating-progress" class="rating-progress">第 1 题 / 共 2 题</div>
                    <button id="rating-back" class="rating-back hidden" type="button">返回上一题</button>
                    <div id="rating-question" class="rating-question">${question1}</div>
                    <div id="rating-options" class="rating-options">${ratingButtons}</div>
                    <div class="rating-anchors"><span>1 非常不赞同</span><span>3 一般</span><span>5 非常赞同</span></div>
                    <button id="rating-confirm" class="rating-confirm" disabled>确认并继续</button>
                </div>
            </div>`,
            on_load: function() {
                const totalStart = Date.now();
                let phase = 1;
                let phaseStart = Date.now();
                let trustDraft = null;
                let coopDraft = null;
                let trustScore = null;
                let coopScore = null;
                let trustRT = 0;
                let coopRT = 0;
                let backToQ1Count = 0;

                const options = Array.from(document.querySelectorAll('.rating-option'));
                const confirmBtn = document.getElementById('rating-confirm');
                const backBtn = document.getElementById('rating-back');
                const questionEl = document.getElementById('rating-question');

                function renderSelection(value) {
                    options.forEach(btn => btn.classList.toggle('selected', Number(btn.dataset.score) === value));
                    confirmBtn.disabled = (value === null);
                }

                function showPhase(nextPhase) {
                    phase = nextPhase;
                    phaseStart = Date.now();
                    if (phase === 1) {
                        document.getElementById('rating-progress').innerText = '第 1 题 / 共 2 题';
                        questionEl.innerText = question1;
                        questionEl.classList.remove('long-question');
                        backBtn.classList.add('hidden');
                        renderSelection(trustDraft);
                    } else {
                        document.getElementById('rating-progress').innerText = '第 2 题 / 共 2 题';
                        questionEl.innerText = question2;
                        questionEl.classList.add('long-question');
                        backBtn.classList.remove('hidden');
                        renderSelection(coopDraft);
                    }
                }

                options.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const score = Number(this.dataset.score);
                        if (phase === 1) trustDraft = score;
                        else coopDraft = score;
                        renderSelection(score);
                    });
                });

                backBtn.addEventListener('click', function() {
                    if (phase !== 2) return;
                    coopRT += Date.now() - phaseStart;
                    backToQ1Count++;
                    showPhase(1);
                });

                confirmBtn.addEventListener('click', function() {
                    if (phase === 1 && trustDraft === null) return;
                    if (phase === 2 && coopDraft === null) return;
                    if (phase === 1) {
                        trustScore = trustDraft;
                        trustRT += Date.now() - phaseStart;
                        showPhase(2);
                    } else {
                        coopScore = coopDraft;
                        coopRT += Date.now() - phaseStart;
                        const imageBase = String(trialData.image || '').replace(/\.png$/i,'');
                        const numMatch = imageBase.match(/(\d+)$/);
                        const sceneNum = numMatch ? Number(numMatch[1]) : trialData.scene;
                        const imageNumber = trialData.risk === 'High' ? sceneNum : (trialData.risk === 'Low' ? 6 + sceneNum : 0);
                        const seqName = versionIndex === 0 ? 'A' : 'B';

                        const result = {
                            Event_Type: isFormal ? 'Formal_Trial' : 'Practice_Trial',
                            Subject_ID: currentSubjectId,
                            DataPipe_Condition: dataPipeCondition,
                            Sequence: seqName,
                            Spatial_Layout: spatialLayout,
                            Formal_Trial_Order: isFormal ? trialData.formalTrialOrder : 0,
                            Block: isFormal ? trialData.block : 0,
                            Block_Position: isFormal ? trialData.blockPosition : 0,
                            Image_Number: imageNumber,
                            Image_ID: imageBase,
                            Image_File: trialData.image,
                            Scene_ID: trialData.scene,
                            Risk_Level: trialData.risk,
                            Assistant_Label: isFormal ? trialData.assistantLabel : 'Practice',
                            Config_Code: `${trialData.config.abilityLevel}/${trialData.config.emotionLevel}`,
                            Config_Type: trialData.config.key,
                            Config_Name_CN: trialData.config.internalName,
                            Ability_Level: trialData.config.abilityLevel,
                            Emotion_Level: trialData.config.emotionLevel,
                            Trust_Score: trustScore,
                            Trust_RT_ms: trustRT,
                            Cooperation_Score: coopScore,
                            Cooperation_RT_ms: coopRT,
                            Back_to_Q1_Count: backToQ1Count,
                            Total_Trial_Time_ms: Date.now() - totalStart,
                            Baseline_Ability_Points: baselineAbility,
                            Baseline_Emotion_Points: baselineEmotion
                        };
                        jsPsych.finishTrial(result);
                    }
                });
            }
        };
    }

    async function startExperiment() {
        const inputVal = document.getElementById('subject-id-input').value.trim();
        if (!inputVal || !/^[A-Za-z0-9_-]{1,30}$/.test(inputVal)) {
            alert('请输入有效的被试编号（仅使用字母、数字、下划线或短横线）。');
            return;
        }

        currentSubjectId = inputVal;

        const startButton = document.querySelector('.login-btn');
        const originalButtonText = startButton.innerText;
        startButton.disabled = true;
        startButton.innerText = '正在准备体验…';

        // 先完整加载图片，再申请 DataPipe 条件。这样资源失败不会占用一个平衡版本。
        showResourceLoader();
        try {
            await robustPreloadImages(ALL_IMAGES, updateResourceLoader);
        } catch (error) {
            console.error('Resource preload failed:', error);
            showResourceLoadError(error);
            return;
        }

        try {
            dataPipeCondition = await getDataPipeCondition();
            if (dataPipeCondition < 0 || dataPipeCondition > 3) {
                throw new Error(`收到未预期的条件编号：${dataPipeCondition}。请确认 DataPipe 的条件数设置为 4。`);
            }
        } catch (error) {
            console.error(error);
            document.getElementById('jspsych-target').innerHTML = '';
            document.getElementById('login-screen').classList.remove('hidden');
            startButton.disabled = false;
            startButton.innerText = originalButtonText;
            if (DATAPIPE_REQUIRED) {
                alert('暂时无法连接实验服务器或获取平衡条件，请检查网络后重试。\n\n' + (error.message || error));
                return;
            } else {
                // 仅供本地开发测试：DataPipe 不可用时按被试编号回退。
                dataPipeCondition = Array.from(String(currentSubjectId)).reduce((a,c)=>a+c.charCodeAt(0),0) % 4;
            }
        }

        // 4个在线条件 = 2套正式试次顺序（A/B） × 2种左右布局。
        // 四个助手的字母标签固定，不参与版本平衡。
        versionIndex = Math.floor(dataPipeCondition / 2); // 0=SeqA, 1=SeqB
        spatialLayout = (dataPipeCondition % 2 === 0) ? 'CompLeft' : 'WarmthLeft';
        setupAssistantLabels();
        const seqName = versionIndex === 0 ? 'SeqA' : 'SeqB';
        currentVersion = `DP${dataPipeCondition}_${seqName}_${spatialLayout}_FixedLabels`;

        jsPsych.data.addProperties({
            Subject_ID: currentSubjectId,

            DataPipe_Condition: dataPipeCondition,
            Version: currentVersion,

        document.getElementById('login-screen').classList.add('hidden');

            image:'test.png', risk:'Practice', scene:0, stimIndex:-1,

                    <div class="concept-card"><h3>感知功能：看清当前环境</h3><p>识别道路、车辆、行人、交通灯等当前环境信息，并感知车内相关状态。</p></div>
                    <div class="concept-card"><h3>预测功能：判断接下来可能发生什么</h3><p>根据当前信息预判接下来可能发生的变化，例如旁车加塞、前车急刹等风险。</p></div>
                    <div class="concept-card"><h3>执行功能：做出并完成驾驶操作</h3><p>综合环境与风险信息形成驾驶决策，并自主完成路线规划、制动、转向等操作。</p></div>
                </div>
                <div class="quiz-section">
                    <b>理解测验：</b>“汽车在高速上行驶时，系统判断右前方货车接下来可能压线并入本车道，并提前做好减速准备。”这主要体现了哪项功能？
                    <div class="quiz-options">
                        <button class="quiz-option" data-answer="1">1　感知功能</button>
                        <button class="quiz-option" data-answer="2">2　预测功能</button>
                        <button class="quiz-option" data-answer="3">3　执行功能</button>
                    </div>
                    <div id="ability-feedback" class="warn-text" style="color:#b0bec5;">请选择一个答案。</div>
                    <div style="text-align:center;"><button id="ability-continue" class="continue-btn" disabled>继续</button></div>
                </div>
            </div>`,
            data: {Event_Type:'Concept_Ability'},
            on_load: function() {
                let attempts = 0;
                document.querySelectorAll('.quiz-option').forEach(btn => {
                    btn.addEventListener('click', function() {
                        attempts++;
                        document.querySelectorAll('.quiz-option').forEach(x => x.classList.remove('selected','correct','wrong'));
                        this.classList.add('selected');
                        const correct = this.dataset.answer === '2';
                        this.classList.add(correct ? 'correct' : 'wrong');
                        document.getElementById('ability-feedback').style.color = correct ? '#4CAF50' : '#ffb74d';
                        document.getElementById('ability-feedback').innerText = correct ? '回答正确：这里强调的是对接下来风险变化的预判。' : '请再想一想：题干强调的是“接下来可能发生什么”。';
                        document.getElementById('ability-continue').disabled = !correct;
                    });
                });
                document.getElementById('ability-continue').addEventListener('click', () => jsPsych.finishTrial({Ability_Quiz_Attempts:attempts, Ability_Quiz_Correct:1}));
            }
        });

        /* 概念学习：情感 */
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            choices: 'NO_KEYS',
            stimulus: `
            <div class="fullscreen-container">
                <div class="guide-title">了解“情感属性”</div>
                <div class="concept-cards">
                    <div class="concept-card warmth"><h3>觉察功能：发现乘客当前状态</h3><p>通过面部、语音、姿态等信息识别乘客当前的疲惫、焦虑、平静等状态。</p></div>
                    <div class="concept-card warmth"><h3>共情功能：理解并回应乘客感受</h3><p>理解乘客为什么产生相应感受，并通过适当语言表达理解、关心和回应。</p></div>
                    <div class="concept-card warmth"><h3>调节功能：帮助改善乘坐体验</h3><p>根据乘客状态采取灯光、音乐、空调或减少打扰等措施，帮助改善乘坐体验。</p></div>
                </div>
                <div class="quiz-section">
                    <b>理解测验：</b>“系统识别到乘客较疲惫后，主动调低空调风量并减少语音播报，让车内保持安静。”这主要体现了哪项功能？
                    <div class="quiz-options">
                        <button class="quiz-option" data-answer="1">1　觉察功能</button>
                        <button class="quiz-option" data-answer="2">2　共情功能</button>
                        <button class="quiz-option" data-answer="3">3　调节功能</button>
                    </div>
                    <div id="emotion-feedback" class="warn-text" style="color:#b0bec5;">请选择一个答案。</div>
                    <div style="text-align:center;"><button id="emotion-continue" class="continue-btn" disabled>继续</button></div>
                </div>
            </div>`,
            data: {Event_Type:'Concept_Emotion'},
            on_load: function() {
                let attempts = 0;
                document.querySelectorAll('.quiz-option').forEach(btn => {
                    btn.addEventListener('click', function() {
                        attempts++;
                        document.querySelectorAll('.quiz-option').forEach(x => x.classList.remove('selected','correct','wrong'));
                        this.classList.add('selected');
                        const correct = this.dataset.answer === '3';
                        this.classList.add(correct ? 'correct' : 'wrong');
                        document.getElementById('emotion-feedback').style.color = correct ? '#4CAF50' : '#ffb74d';
                        document.getElementById('emotion-feedback').innerText = correct ? '回答正确：这里已经根据乘客状态采取了具体调节措施。' : '请再想一想：题干强调的是系统已经采取了改善体验的具体措施。';
                        document.getElementById('emotion-continue').disabled = !correct;
                    });
                });
                document.getElementById('emotion-continue').addEventListener('click', () => jsPsych.finishTrial({Emotion_Quiz_Attempts:attempts, Emotion_Quiz_Correct:1}));
            }
        });

        timeline.push(createBaselineAllocationNode());
        timeline.push(createAssistantIntroNode());
        timeline.push(createPracticeInstructionNode());
        timeline.push(createRatingTrialNode(practiceTrial, false));
        timeline.push(createFormalInstructionNode());

        for (let i=0; i<formalTrials.length; i++) {
            timeline.push(createRatingTrialNode(formalTrials[i], true));
            if (i === 23) timeline.push(createRestNode());
        }

        jsPsych.run(timeline);
    }
</script>
</body>
