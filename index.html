<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>智能驾驶体验</title>
    <!-- build: 2026-08-16-jspsych-webp-responsive-font-v4 -->
    <script src="jspsych/jspsych.js"></script>
    <script src="plugins/plugin-html-keyboard-response.js"></script>
    <link rel="stylesheet" href="jspsych/jspsych.css">

    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #e0e0e0;
            font-family: 'Microsoft YaHei', sans-serif;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        #jspsych-target { width: 100%; min-height: 100dvh; }
        .jspsych-display-element {
            background-color: #1e1e24;
            color: #e0e0e0;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .jspsych-content-wrapper {
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100dvh;
            height: auto;
            padding: 0;
            box-sizing: border-box;
        }
        .jspsych-content { width: 100%; max-width: none; }
        .hidden { display: none !important; }
.fullscreen-container {
            width: 100%;
            min-height: 100dvh;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 18px 0;
            overflow: visible;
        }
        .highlight-text { color: #ffb74d; font-weight: bold; }
        .ready-text { color: #4CAF50; font-weight: bold; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 登录 */
        .login-box {
            background-color: #2b2b36;
            padding: 50px;
            border-radius: 12px;
            border: 1px solid #444;
            text-align: center;
        }
        .login-title { font-size: 32px; color: #64b5f6; margin-bottom: 30px; font-weight: bold; }
        .login-input {
            font-size: 28px;
            padding: 10px;
            width: 220px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #64b5f6;
            background-color: #15151a;
            color: white;
            margin-bottom: 30px;
            outline: none;
        }
        .login-btn, .action-btn {
            font-size: 22px;
            padding: 12px 34px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .login-btn:hover, .action-btn:hover { filter: brightness(1.08); }

        /* 通用指导语 */
        .guide-box {
            background-color: #2b2b36;
            padding: 38px 56px;
            border-radius: 12px;
            border: 1px solid #444;
            width: min(900px, 88vw);
            line-height: 1.8;
            font-size: 21px;
            text-align: left;
            box-sizing: border-box;
        }
        .guide-box.center-guide { text-align: left; }
        .guide-box.center-guide .context-box { text-align: left; }
        .guide-box.center-guide .guide-rules { text-align: left; }
        .guide-title {
            font-size: 34px;
            color: #64b5f6;
            margin-bottom: 26px;
            font-weight: bold;
            text-align: center;
        }
        .footer-hint { margin-top: 32px; text-align: center; font-size: 20px; color: #9e9e9e; height: 30px; }
        .context-box {
            background-color: #383846;
            padding: 18px 26px;
            border-left: 5px solid #ffb74d;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 19px;
        }
        .key-hint-box {
            background-color: #15151a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
            font-size: 19px;
            margin-top: 15px;
            color: #b0bec5;
        }

        /* 概念学习 */
        .concept-cards { display: flex; gap: 20px; width: min(1000px, 92vw); margin-bottom: 18px; }
        .concept-card {
            flex: 1;
            background-color: #383846;
            border-radius: 8px;
            padding: 20px;
            border-top: 4px solid #64b5f6;
            text-align: left;
        }
        .concept-card.warmth { border-top-color: #ffb74d; }
        .concept-card h3 { margin-top: 0; color: #e0e0e0; border-bottom: 1px solid #555; padding-bottom: 10px; font-size: 20px; text-align:left; }
        .concept-card p { font-size: 16px; color: #b0bec5; line-height: 1.6; text-align:left; }
        .quiz-section {
            background-color: #15151a;
            border: 1px solid #444;
            padding: 22px 36px;
            border-radius: 8px;
            width: min(920px, 88vw);
            font-size: 19px;
            margin-top: 28px;
            text-align: left;
            box-sizing: border-box;
        }

        /* 人口学 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 24px;
            margin-top: 20px;
        }
        .form-item {
            background-color: #15151a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px;
        }
        .form-item label { display: block; margin-bottom: 10px; color: #b0bec5; font-size: 17px; }
        .form-item input, .form-item select {
            width: 100%;
            box-sizing: border-box;
            background-color: #2b2b36;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            font-size: 18px;
            outline: none;
        }
        .warn-text { text-align: center; color: #ff5252; font-size: 18px; margin-top: 16px; min-height: 24px; font-weight: bold; }

        /* 基线点数分配 */
        .allocation-wrap {
            display: flex;
            gap: 34px;
            justify-content: center;
            align-items: stretch;
            margin: 24px 0;
        }
        .allocation-card {
            width: 320px;
            padding: 24px;
            background-color: #15151a;
            border: 1px solid #444;
            border-radius: 10px;
            text-align: center;
        }
        .allocation-card.comp { border-top: 5px solid #4CAF50; }
        .allocation-card.warm { border-top: 5px solid #FF9800; }
        .allocation-score { font-size: 54px; font-weight: bold; margin: 16px 0; }
        .allocation-controls { display: flex; justify-content: center; gap: 18px; }
        .mini-btn {
            width: 54px;
            height: 44px;
            font-size: 26px;
            border-radius: 8px;
            border: 1px solid #666;
            background-color: #383846;
            color: #fff;
            cursor: pointer;
        }

        /* 四种助手介绍卡 */
        .assistant-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            width: min(1100px, 92vw);
        }
        .assistant-card {
            background-color: #2b2b36;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px 24px;
            box-sizing: border-box;
        }
        .assistant-card-title { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 14px; color: #fff; }
        /* 助手学习页：属性名称与能量条分两行，避免大字体与能量条互相遮挡。 */
        .mini-dim-row { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; margin:10px 0 12px; min-width:0; }
        .mini-dim-label { width:auto; max-width:100%; font-size:18px; font-weight:bold; white-space:normal; line-height:1.25; text-align:center; }
        .mini-bars { display:flex; justify-content:center; gap:10px; flex-wrap:nowrap; max-width:100%; }
        .mini-bar { width: 54px; height: 20px; border: 2px solid #777; border-radius: 5px; background-color: rgba(255,255,255,0.04); }
        .mini-bar.comp.on { background-color: #4CAF50; border-color: #4CAF50; box-shadow: 0 0 8px rgba(76,175,80,0.35); }
        .mini-bar.warm.on { background-color: #FF9800; border-color: #FF9800; box-shadow: 0 0 8px rgba(255,152,0,0.35); }

        /* 正式试验矩阵：沿用3b的两列结构 */
        .matrix-shell {
            display: flex;
            width: min(1200px, 94vw);
            justify-content: space-between;
            align-items: flex-start;
            margin: 0 auto;
        }
        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50%;
            min-width: 0;
            box-sizing: border-box;
        }
        .panel-title {
            font-size: clamp(20px, 1.45vw, 27px);
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 2px;
            text-align: center;
        }
        .attr-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }
        .attr-name {
            font-size: clamp(15px, 1.05vw, 20px);
            color: #b0bec5;
            margin-bottom: 5px;
            text-align: center;
            font-weight: bold;
            max-width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .block-container { display: flex; gap: clamp(10px, 1vw, 18px); justify-content: center; }
        .block {
            width: clamp(42px, 3.5vw, 62px);
            height: clamp(15px, 1.35vw, 24px);
            border-radius: 6px;
            border: 2px solid #777;
            box-sizing: border-box;
        }
        .block-filled-comp { background-color: #4CAF50; border-color: #4CAF50; box-shadow: 0 0 10px rgba(76,175,80,0.35); }
        .block-filled-warm { background-color: #FF9800; border-color: #FF9800; box-shadow: 0 0 10px rgba(255,152,0,0.35); }
        .block-empty { background-color: rgba(255,255,255,0.04); }

        /* 试次下方评分区 */
        .rating-question { font-size: clamp(19px, 1.45vw, 27px); font-weight: bold; color: #f0f0f0; margin-bottom: 14px; text-align: center; }
        .rating-scale {
            display: flex;
            justify-content: space-between;
            width: min(1000px, 90vw);
            font-size: clamp(14px, 1vw, 18px);
            color: #64b5f6;
            font-weight: bold;
        }
        .rating-choice { margin-top: 12px; font-size: clamp(18px, 1.25vw, 23px); color: #4CAF50; font-weight: bold; text-align: center; }
        .rating-hint { margin-top: 8px; color: #ffb74d; font-size: clamp(14px, 1vw, 18px); text-align: center; }
        .assistant-badge {
            position: static;
            transform: none;
            padding: 5px 18px;
            background-color: #15151a;
            border: 1px solid #555;
            border-radius: 999px;
            font-size: clamp(14px, 1vw, 18px);
            color: #d7d7d7;
            z-index: 3;
            flex: 0 0 auto;
        }


        /* ===== 在线/触屏版补充样式 ===== */
        button, input { touch-action: manipulation; }
        .continue-btn {
            min-width: 180px;
            min-height: 52px;
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            background: #4CAF50;
            color: #fff;
            cursor: pointer;
        }
        .continue-btn:disabled { opacity: .45; cursor: not-allowed; }
        .quiz-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
        }
        .quiz-option {
            min-height: 54px;
            padding: 10px 12px;
            border-radius: 9px;
            border: 1px solid #666;
            background: #2b2b36;
            color: #f0f0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .quiz-option.selected { border-color:#64b5f6; box-shadow:0 0 0 2px rgba(100,181,246,.25) inset; }
        .quiz-option.correct { border-color:#4CAF50; background:rgba(76,175,80,.18); }
        .quiz-option.wrong { border-color:#ff7043; background:rgba(255,112,67,.14); }
        .level-legend {
            width:min(1080px,92vw);
            background:#15151a;
            border:1px solid #444;
            border-radius:10px;
            padding:16px 22px;
            box-sizing:border-box;
            margin:0 auto 18px;
            line-height:1.7;
            font-size:17px;
            color:#c9c9c9;
        }
        .legend-levels {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:12px;
            margin-top:12px;
        }
        .legend-level {
            background:#2b2b36;
            border:1px solid #4b4b56;
            border-radius:8px;
            padding:10px;
            text-align:center;
        }
        .legend-bars {
            display:flex;
            justify-content:center;
            gap:7px;
            margin-bottom:7px;
        }
        .legend-bar {
            width:34px;
            height:13px;
            border:1.5px solid #777;
            border-radius:4px;
            background:rgba(255,255,255,.04);
            box-sizing:border-box;
        }
        .legend-bar.on {
            background:#64b5f6;
            border-color:#64b5f6;
            box-shadow:0 0 7px rgba(100,181,246,.28);
        }
        .assistant-note { color:#aeb7c2; font-size:15px; line-height:1.55; margin-top:10px; text-align:center; }
        .assistant-profile { color:#ffcf8a; font-size:16px; line-height:1.4; margin:2px 0 12px; text-align:center; font-weight:bold; }
        .rating-topline {
            width:min(760px,90vw);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            min-height:30px;
            margin-bottom:4px;
            box-sizing:border-box;
        }
        .rating-back { position:static; flex:0 0 auto; border:1px solid #666; border-radius:7px; background:#1f2028; color:#c8d2dc; padding:5px 10px; font-size:12px; line-height:1.25; cursor:pointer; }
        .rating-back.hidden { visibility:hidden; pointer-events:none; }
        .rating-options {
            display:grid;
            grid-template-columns:repeat(5, 1fr);
            gap:14px;
            width:min(760px,90vw);
            margin-top:8px;
        }
        .rating-option {
            min-height:54px;
            padding:6px 8px;
            border-radius:10px;
            border:2px solid #59616d;
            background:#1f2028;
            color:#64b5f6;
            font-size:24px;
            font-weight:bold;
            cursor:pointer;
        }
        .rating-anchors {
            width:min(760px,90vw);
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            margin-top:4px;
            color:#b7c5d3;
            font-size:15px;
        }
        .rating-anchors span:nth-child(1){text-align:left;}
        .rating-anchors span:nth-child(2){text-align:center;}
        .rating-anchors span:nth-child(3){text-align:right;}
        .rating-option.selected {
            border-color:#4CAF50;
            background:rgba(76,175,80,.16);
            box-shadow:0 0 0 2px rgba(76,175,80,.15) inset;
        }
        .rating-confirm {
            margin-top:10px;
            min-width:150px;
            min-height:44px;
            padding:8px 22px;
            border:0;
            border-radius:9px;
            background:#4CAF50;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
        }
        .rating-confirm:disabled { opacity:.4; cursor:not-allowed; }
        .rating-zone { position:relative; }
        .rating-progress {
            position:static;
            flex:1 1 auto;
            min-width:0;
            font-size:14px;
            color:#9e9e9e;
            margin:0;
            text-align:left;
            line-height:1.3;
        }
        .trial-shell { display:flex; flex-direction:column; height:100dvh; min-height:100dvh; width:100%; overflow:hidden; box-sizing:border-box; }
        .scene-image-frame {
            position: relative;
            width: min(95%, 637px);
            aspect-ratio: 637 / 315;
            max-height: 100%;
            background-color: #15151a;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            flex: 0 0 auto;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .scene-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .scene-load-hint {
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:16px;
            box-sizing:border-box;
            text-align:center;
            color:#b0bec5;
            background:#15151a;
            font-size:clamp(14px,3.2vw,18px);
            z-index:2;
        }
        .scene-load-hint.error { color:#ffb74d; }
        .rating-option:disabled { opacity:.35; cursor:not-allowed; }
        .device-note { font-size:14px; color:#8e98a5; text-align:center; margin-top:10px; }

        @media (max-width: 900px) {
            .guide-box { width:94vw; padding:24px 24px; font-size:18px; }
            .guide-title { font-size:27px; margin-bottom:18px; }
            .concept-cards { width:94vw; gap:12px; }
            .concept-card { padding:14px; }
            .concept-card h3 { font-size:17px; }
            .concept-card p { font-size:14px; }
            .assistant-grid { width:94vw; gap:12px; }
            .assistant-card { padding:14px; }
            .assistant-card-title { font-size:20px; }
            .mini-dim-label { width:84px; font-size:15px; }
            .mini-bar { width:34px; height:17px; }
            .allocation-wrap { gap:14px; }
            .allocation-card { width:min(300px,42vw); padding:16px; }
            .rating-options { gap:8px; grid-template-columns:repeat(5, 1fr); width:92vw; }
            .rating-option { min-width:0; min-height:50px; padding:4px; font-size:22px; }
            .rating-anchors { width:92vw; font-size:13px; }
            .matrix-shell { width:98vw; }
            .block { width:clamp(28px,7vw,48px); height:18px; }
            .block-container { gap:6px; }
            .attr-name { font-size:14px; }
            .panel-title { font-size:18px; }
        }
        @media (max-width: 650px) {
            /* 手机端以竖屏为主：页面本身可滚动，但不再使用卡片内部的嵌套滚动。 */
            html, body, #jspsych-target, .jspsych-display-element {
                min-height: 100svh;
                overscroll-behavior-y: contain;
            }
            .jspsych-content-wrapper {
                min-height: 100svh;
                height: auto;
                align-items: flex-start;
            }
            .fullscreen-container {
                width: 100%;
                min-height: 100svh;
                height: auto;
                justify-content: flex-start;
                padding: 12px 0 calc(18px + env(safe-area-inset-bottom));
                overflow: visible;
            }
            #login-screen.fullscreen-container {
                min-height: 100svh;
                justify-content: center;
                padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
            }
            .login-box {
                width: 90vw;
                padding: 24px 18px;
                box-sizing: border-box;
            }
            .login-title { font-size: 25px; margin-bottom: 16px; }
            .login-input { width: 72vw; max-width: 260px; font-size: 23px; margin-bottom: 18px; }
            .login-btn, .action-btn, .continue-btn {
                min-height: 44px;
                padding: 9px 18px;
                font-size: 16px;
                border-radius: 9px;
            }
            .guide-box {
                width: 92vw;
                padding: 16px 15px;
                font-size: 15.5px;
                line-height: 1.55;
            }
            .guide-title {
                font-size: 23px;
                line-height: 1.25;
                margin-bottom: 11px;
            }
            .context-box {
                padding: 11px 13px;
                margin-bottom: 11px;
                font-size: 14.5px;
                line-height: 1.5;
            }
            .key-hint-box { padding:10px; font-size:14px; margin-top:10px; }
            .footer-hint { margin-top:14px; height:auto; font-size:15px; }

            /* 概念学习：三张卡片全部直接呈现，不在卡片区内滚动。 */
            .concept-cards {
                width: 92vw;
                flex-direction: column;
                gap: 19px;
                margin-bottom: 12px;
                max-height: none;
                overflow: visible;
            }
            .concept-card {
                padding: 8px 11px;
                border-top-width: 3px;
            }
            .concept-card h3 {
                font-size: 15px;
                line-height: 1.3;
                margin: 0 0 4px;
                padding-bottom: 4px;
            }
            .concept-card p {
                font-size: 13px;
                line-height: 1.4;
                margin: 0;
            }
            .quiz-section {
                width: 92vw;
                padding: 11px 12px;
                margin-top: 5px;
                font-size: 14px;
                line-height: 1.45;
            }
            .quiz-options {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                margin-top: 10px;
            }
            .quiz-option {
                min-height: 42px;
                padding: 6px 4px;
                font-size: 13px;
                line-height: 1.25;
            }
            .warn-text { font-size:13px; margin-top:8px; min-height:18px; }

            /* 10点分配：手机竖屏仍保持左右并列，避免无意义的纵向滚动。 */
            .allocation-wrap {
                flex-direction: row;
                align-items: stretch;
                gap: 8px;
                margin: 13px 0;
                max-height: none;
                overflow: visible;
                width: 100%;
            }
            .allocation-card {
                width: calc(50% - 4px);
                padding: 11px 7px;
            }
            .allocation-score { font-size:38px; margin:8px 0; }
            .allocation-controls { gap:8px; }
            .mini-btn { width:46px; height:40px; font-size:22px; }

            /* 四助手学习：2×2矩阵一次看全；不再使用单列+内部滚动。 */
            .level-legend {
                width: 92vw;
                padding: 9px 11px;
                margin-bottom: 8px;
                font-size: 13px;
                line-height: 1.45;
            }
            .legend-levels {
                grid-template-columns: repeat(3,1fr);

<script>
    /* =========================================================
       1. 全局变量与材料
       ========================================================= */
    let currentSubjectId = "";
    let versionIndex = 0;
    let spatialLayout = "CompLeft";
    let currentVersion = "";
    let baselineAbility = null;
    let baselineEmotion = null;

    /* =========================================================
       DataPipe / OSF 在线数据回收配置
       =========================================================
       1) 在 https://pipe.jspsych.org 创建实验后，将实验 ID 填到下方。
       2) DataPipe 后台将 Condition assignment 设置为 4 个条件。
          条件 0 = 顺序A × 能力左
          条件 1 = 顺序A × 情感左
          条件 2 = 顺序B × 能力左
          条件 3 = 顺序B × 情感左
       3) 正式收集时 DATAPIPE_REQUIRED 保持 true；若分配/上传失败，实验不会静默继续。
    */
    const DATAPIPE_EXPERIMENT_ID = 'kYthZed2dSW4';
    const DATAPIPE_REQUIRED = true;
    const DATAPIPE_BASE = 'https://pipe.jspsych.org/api';

    let dataPipeCondition = null;
    let sessionUUID = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `fallback-${Date.now()}-${Math.random().toString(16).slice(2)}`;

    function dataPipeConfigured() {
        return DATAPIPE_EXPERIMENT_ID && !DATAPIPE_EXPERIMENT_ID.startsWith('REPLACE_');
    }

    async function getDataPipeCondition() {
        if (!dataPipeConfigured()) {
            throw new Error('DataPipe experiment ID 尚未配置。');
        }
        const response = await fetch(`${DATAPIPE_BASE}/condition/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ experimentID: DATAPIPE_EXPERIMENT_ID })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || typeof result.condition !== 'number') {
            throw new Error(result.message || `DataPipe 条件分配失败（HTTP ${response.status}）`);
        }
        return result.condition;
    }

    function pad2(n) { return String(n).padStart(2, '0'); }
    function pad3(n) { return String(n).padStart(3, '0'); }

    function formatLocalTimestamp(date = new Date()) {
        return `${date.getFullYear()}${pad2(date.getMonth()+1)}${pad2(date.getDate())}_${pad2(date.getHours())}${pad2(date.getMinutes())}${pad2(date.getSeconds())}_${pad3(date.getMilliseconds())}`;
    }

    function buildUniqueDataFilename() {
        const safeSubject = String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g, '_');
        return `${formatLocalTimestamp(new Date())}_Subject${safeSubject}.csv`;
    }

    const CLEAN_CSV_COLUMNS = [
        'Subject_ID','DataPipe_Condition','Sequence','Spatial_Layout','Formal_Trial_Order',
        'Block','Block_Position','Image_Number','Image_ID','Image_File','Scene_ID','Risk_Level',
        'Assistant_Label','Config_Code','Config_Type','Config_Name_CN','Ability_Level','Emotion_Level',
        'Trust_Score','Trust_RT_ms','Cooperation_Score','Cooperation_RT_ms','Back_to_Q1_Count','Total_Trial_Time_ms',
        'Image_Preloaded_Before_Trial','Image_Wait_ms','Preload_Loaded_Count_At_Trial_Start',
        'Baseline_Ability_Points','Baseline_Emotion_Points','Browser_Context','Image_Format'
    ];

    function csvEscape(value) {
        if (value === null || value === undefined) return '';
        const s = String(value);
        return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function buildCleanFormalCSV() {
        const rows = jsPsych.data.get().filter({Event_Type:'Formal_Trial'}).values();
        const lines = [CLEAN_CSV_COLUMNS.join(',')];
        rows.forEach(row => {
            lines.push(CLEAN_CSV_COLUMNS.map(col => csvEscape(row[col])).join(','));
        });
        return lines.join('\r\n');
    }

    async function uploadFinalDataToDataPipe(csvString) {
        if (!dataPipeConfigured()) {
            throw new Error('DataPipe experiment ID 尚未配置。');
        }
        const filename = buildUniqueDataFilename();
        const response = await fetch(`${DATAPIPE_BASE}/data/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                experimentID: DATAPIPE_EXPERIMENT_ID,
                filename: filename,
                data: csvString
            })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.message !== 'Success') {
            throw new Error(result.message || `DataPipe 数据上传失败（HTTP ${response.status}）`);
        }
        return { filename, result };
    }

    function prepareLocalBackup(csvString) {
        window.downloadCSV = function() {
            const fileName = `BACKUP_${formatLocalTimestamp(new Date())}_Subject${String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g,'_')}.csv`;
            const blob = new Blob([csvString.startsWith("\uFEFF") ? csvString : "\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    }

    const txt1 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正行驶在公路上，此时，侧方有一辆车准备汇入我们所在的车道…";
    const txt2 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正沿着道路向前行驶，此时，前方路面出现了施工区域和路障…";
    const txt3 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆即将进入居民区，正在驶向路口…";
    const txt4 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正准备通过前方的十字路口，此时，前方交通状况发生了变化…";
    const txt5 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆正准备驶入弯道区域…";
    const txt6 = "您现在正坐在由当前智驾助手驾驶的汽车后排。车辆即将抵达目的地，准备寻找合适的空车位停车…";
    const sceneText = {1: txt1, 2: txt2, 3: txt3, 4: txt4, 5: txt5, 6: txt6};

    /* 四种实验条件。level=1/2/3分别表示该大类属性的低/中/高配置。
       正式界面中，三个能力层级共享abilityLevel，三个情感层级共享emotionLevel。 */
    const CONFIGS = [
        { key: 'AbilityOriented', internalName: '能力导向型', abilityLevel: 3, emotionLevel: 1 },
        { key: 'EmotionOriented', internalName: '情感导向型', abilityLevel: 1, emotionLevel: 3 },
        { key: 'BalancedBaseline', internalName: '均衡基线型', abilityLevel: 2, emotionLevel: 2 },
        { key: 'LowLow', internalName: '双低配置型', abilityLevel: 1, emotionLevel: 1 }
    ];

    /* 四个助手固定对应唯一配置，不随版本改变。
       A=能力导向(3/1)，B=情感导向(1/3)，C=均衡基线(2/2)，D=双低(1/1)。 */
    let assistantLabelMap = {};
    let configToLabel = {};

    /* 12个驾驶刺激：6种场景 × 高/低风险，各1张。
       顺序沿用3b中已经人为拉开同类场景距离的排列。 */
    const BASE_STIMULI = [
        { image:'high1.webp', risk:'High', scene:1 },
        { image:'low2.webp',  risk:'Low',  scene:2 },
        { image:'high3.webp', risk:'High', scene:3 },
        { image:'low4.webp',  risk:'Low',  scene:4 },
        { image:'low5.webp',  risk:'Low',  scene:5 },
        { image:'high6.webp', risk:'High', scene:6 },
        { image:'high2.webp', risk:'High', scene:2 },
        { image:'low3.webp',  risk:'Low',  scene:3 },
        { image:'low1.webp',  risk:'Low',  scene:1 },
        { image:'high4.webp', risk:'High', scene:4 },
        { image:'high5.webp', risk:'High', scene:5 },
        { image:'low6.webp',  risk:'Low',  scene:6 }
    ].map((x, i) => ({...x, stimIndex:i, text:sceneText[x.scene]}));

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target',
        on_finish: async function() {
            const rawCleanCsv = buildCleanFormalCSV();
            const csvString = "\uFEFF" + rawCleanCsv;
            prepareLocalBackup(csvString);

            document.getElementById('jspsych-target').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background-color:#1e1e24;min-height:100vh;color:white;box-sizing:border-box;">
                    <div style="max-width:760px;">
                        <h2 style="color:#64b5f6;">体验已完成，正在提交数据……</h2>
                        <p style="color:#bbb;line-height:1.8;">请暂时不要关闭、刷新或返回此页面。数据成功保存到研究数据库后会自动显示确认信息。</p>
                    </div>
                </div>`;

            try {
                const upload = await uploadFinalDataToDataPipe(csvString);
                document.getElementById('jspsych-target').innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background-color:#1e1e24;min-height:100vh;color:white;box-sizing:border-box;">
                        <div style="max-width:760px;">
                            <h2 style="color:#4CAF50;">✓ 数据提交成功</h2>
                            <p style="color:#ddd;line-height:1.8;">本次体验已全部结束，感谢您的参与！现在可以安全关闭此页面。</p>
                            <p style="color:#777;font-size:14px;">数据文件：${upload.filename}</p>
                        </div>
                    </div>`;
                console.log('DataPipe upload success:', upload.filename);
            } catch (error) {
                console.error('DataPipe upload failed:', error);
                document.getElementById('jspsych-target').innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background-color:#1e1e24;min-height:100vh;color:white;box-sizing:border-box;">
                        <div style="max-width:820px;">
                            <h2 style="color:#ff7043;">数据暂未成功上传</h2>
                            <p style="color:#ddd;line-height:1.8;">请不要直接关闭页面。您可以先检查网络并刷新后重新完成实验；如研究者允许，也可点击下方按钮保存本地备份文件并联系研究者。</p>
                            <p style="color:#ffb74d;font-size:15px;word-break:break-all;">错误信息：${String(error.message || error)}</p>
                            <button onclick="downloadCSV()" style="padding:12px 24px;font-size:18px;background-color:#64b5f6;color:#111;border:none;border-radius:8px;cursor:pointer;">保存本地备份 CSV</button>
                            <p style="color:#777;font-size:14px;margin-top:20px;">会话编号：${sessionUUID}</p>
                        </div>
                    </div>`;
            }
        }
    });

    /* =========================================================
       场景资源管理器：3 个滚动并发槽位
       ---------------------------------------------------------
       - 使用 jsPsych 官方 pluginAPI.preloadImages()
       - 同时最多 3 张；任一完成后立即补下一张
       - 不阻塞欢迎页/概念学习/点数分配等前半段流程
       - test.webp 优先；正式图片按该被试实际试次的首次出现顺序排队
       ========================================================= */
    const SCENE_PRELOAD_CONCURRENCY = 3;

    const scenePreloader = (() => {
        let queue = [];
        let active = 0;
        let running = false;
        const loaded = new Set();
        const loading = new Set();
        const queued = new Set();
        const failed = new Map();
        const waiters = new Map();

        function norm(file) {
            const clean = String(file || '').replace(/^img\//, '').replace(/[^A-Za-z0-9_.-]/g, '');
            return `img/${clean}`;
        }

        function loadedCount() { return loaded.size; }
        function isLoaded(file) { return loaded.has(norm(file)); }
        function isLoading(file) { return loading.has(norm(file)); }

        function notifySuccess(file) {
            const list = waiters.get(file) || [];
            waiters.delete(file);
            list.forEach(w => { try { w.ok(); } catch(e) { console.error(e); } });
        }

        function notifyFailure(file, error) {
            const list = waiters.get(file) || [];
            waiters.delete(file);
            list.forEach(w => { try { if (w.fail) w.fail(error); } catch(e) { console.error(e); } });
        }

        function enqueue(files, front=false) {
            const fresh = [];
            files.forEach(raw => {
                const file = norm(raw);
                if (loaded.has(file) || loading.has(file) || queued.has(file)) return;
                queued.add(file);
                fresh.push(file);
            });
            if (front) queue = fresh.concat(queue);
            else queue.push(...fresh);
            if (running) pump();
        }

        function prioritize(file) {
            file = norm(file);
            if (loaded.has(file) || loading.has(file)) return;
            queue = queue.filter(x => x !== file);
            queued.delete(file);
            queued.add(file);
            queue.unshift(file);
            if (running) pump();
        }

        function whenLoaded(file, ok, fail) {
            file = norm(file);
            if (loaded.has(file)) {
                setTimeout(ok, 0);
                return;
            }
            if (!waiters.has(file)) waiters.set(file, []);
            waiters.get(file).push({ok, fail});
            prioritize(file);
        }

        function markLoaded(file) {
            file = norm(file);
            if (loaded.has(file)) return;
            loaded.add(file);
            loading.delete(file);
            queued.delete(file);
            failed.delete(file);
            notifySuccess(file);
        }

        function launch(file) {
            active++;
            loading.add(file);
            queued.delete(file);
            const startedAt = performance.now();

            jsPsych.pluginAPI.preloadImages(
                [file],
                function() {
                    active--;
                    loading.delete(file);
                    loaded.add(file);
                    failed.delete(file);
                    console.log(`[scene preload] loaded ${file} in ${((performance.now()-startedAt)/1000).toFixed(1)}s; ${loaded.size}/13`);
                    notifySuccess(file);
                    pump();
                },
                function() {},
                function(errorInfo) {
                    active--;
                    loading.delete(file);
                    const tries = (failed.get(file) || 0) + 1;
                    failed.set(file, tries);
                    console.warn('[scene preload] error', file, errorInfo, 'try', tries);

                    // 网络错误时最多自动重试 2 次；正式 trial 仍有当前图片门控作为最后保障。
                    if (tries <= 2) {
                        setTimeout(() => {
                            if (!loaded.has(file) && !loading.has(file)) {
                                queued.add(file);
                                queue.push(file);
                                pump();
                            }
                        }, 1500);
                    } else {
                        notifyFailure(file, errorInfo);
                        pump();
                    }
                }
            );
        }

        function pump() {
            if (!running) return;
            while (active < SCENE_PRELOAD_CONCURRENCY && queue.length > 0) {
                const file = queue.shift();
                if (loaded.has(file) || loading.has(file)) {
                    queued.delete(file);
                    continue;
                }
                launch(file);
            }
        }

        function start(files) {
            running = true;
            enqueue(files, false);
            pump();
        }

        return {
            start, enqueue, prioritize, whenLoaded, markLoaded,
            isLoaded, isLoading, loadedCount,
            normalize: norm
        };
    })();

    function rotateArray(arr, shift) {
        const n = arr.length;
        const s = ((shift % n) + n) % n;
        return arr.slice(s).concat(arr.slice(0, s));
    }

    function setupAssistantLabels() {
        assistantLabelMap = {
            A: CONFIGS[0],
            B: CONFIGS[1],
            C: CONFIGS[2],
            D: CONFIGS[3]
        };
        configToLabel = {
            AbilityOriented: 'A',
            EmotionOriented: 'B',
            BalancedBaseline: 'C',
            LowLow: 'D'
        };
    }

    /* 48个正式试次 = 12个驾驶刺激 × 4种助手配置。
       每个刺激在4个block中恰好与4种助手各配对1次；每个block中四种助手各出现3次。
       这样对每名被试均完整覆盖4助手×2风险，并用A/B顺序版本轮换初始配对关系。 */
    function buildFormalTrials() {
        let all = [];
        for (let b = 0; b < 4; b++) {
            let blockOrder = rotateArray(BASE_STIMULI, (versionIndex * 2 + b * 3) % BASE_STIMULI.length);
            if (b % 2 === 1) blockOrder = blockOrder.slice().reverse();

            blockOrder.forEach((stim, displayPos) => {
                const cfgIndex = (stim.stimIndex + b + versionIndex) % 4;
                const cfg = CONFIGS[cfgIndex];
                all.push({
                    ...stim,
                    block: b + 1,
                    blockPosition: displayPos + 1,
                    config: cfg,
                    assistantLabel: configToLabel[cfg.key]
                });
            });
        }
        return all.map((trial, idx) => ({...trial, formalTrialOrder: idx + 1}));
    }

            } else {
                const cls = i <= level ? (type === 'comp' ? 'block-filled-comp' : 'block-filled-warm') : 'block-empty';
                html += `<div class="block ${cls}"></div>`;
            }
        }
        return html;
    }

    /* =========================================================
       正式实验资源门控
       ---------------------------------------------------------
       - 后台滚动预加载仍从实验前半段持续进行；
       - 练习结束后检查 13 张场景图是否全部准备完成；
       - 若已全部完成，本节点完全跳过，被试不会看到加载页；
       - 若尚未完成，仅在此处显示统一进度页，全部完成后自动进入正式指导语。
       ========================================================= */
    function createFormalResourceGateNode(requiredImages) {
        const files = requiredImages.map(scenePreloader.normalize);
        const total = files.length;

        const waitTrial = {
            type: jsPsychHtmlKeyboardResponse,
            choices: 'NO_KEYS',
            stimulus: `
            <div class="fullscreen-container">
                <div class="guide-box center-guide" style="width:min(820px,90vw);">
                    <div class="guide-title">正式体验准备中</div>
                    <div class="context-box" style="text-align:center;">
                        为保证接下来的驾驶体验连续流畅，系统正在准备剩余的驾驶场景。<br>
                        完成后将自动进入正式体验，请稍候。
                    </div>
                    <div style="width:min(620px,80vw);margin:24px auto 8px;height:14px;background:#15151a;border:1px solid #555;border-radius:999px;overflow:hidden;">
                        <div id="formal-resource-bar" style="height:100%;width:0%;background:#4CAF50;transition:width .25s ease;"></div>
                    </div>
                    <div id="formal-resource-count" style="text-align:center;color:#e0e0e0;font-size:20px;font-weight:bold;margin-top:10px;">准备中…</div>
                    <div id="formal-resource-note" style="text-align:center;color:#9e9e9e;font-size:14px;line-height:1.6;margin-top:12px;">
                        请保持当前页面开启。
                    </div>
                </div>
            </div>`,
            data: {Event_Type:'Formal_Resource_Gate'},
            on_load: function() {
                const startedAt = Date.now();
                const startLoaded = files.filter(f => scenePreloader.isLoaded(f)).length;
                const bar = document.getElementById('formal-resource-bar');
                const count = document.getElementById('formal-resource-count');
                const note = document.getElementById('formal-resource-note');
                let finished = false;
                let retryTick = 0;

                function missingFiles() {
                    return files.filter(f => !scenePreloader.isLoaded(f));
                }

                function refresh() {
                    if (finished) return;
                    const missing = missingFiles();
                    const ready = total - missing.length;
                    const pct = total > 0 ? (ready / total) * 100 : 100;

                    if (bar) bar.style.width = `${pct}%`;
                    if (count) count.innerText = `驾驶场景已准备 ${ready} / ${total}`;

                    const elapsed = Date.now() - startedAt;
                    if (note && elapsed >= 60000) {
                        note.innerText = '当前网络速度较慢，场景仍在继续准备，请保持页面开启。';
                    }

                    if (missing.length === 0) {
                        finished = true;
                        clearInterval(pollTimer);
                        clearInterval(retryTimer);
                        if (count) {
                            count.innerHTML = '<span style="color:#4CAF50;">驾驶场景准备完成</span>';
                        }
                        if (note) note.innerText = '即将进入正式体验…';
                        setTimeout(() => {
                            jsPsych.finishTrial({
                                Event_Type:'Formal_Resource_Gate',
                                Resource_Gate_Wait_ms: Date.now() - startedAt,
                                Resource_Gate_Start_Loaded_Count: startLoaded,
                                Resource_Gate_End_Loaded_Count: total
                            });
                        }, 350);
                    }
                }

                // 把尚未完成的图片再次置于队列前部；已加载/正在加载者不会重复请求。
                scenePreloader.enqueue(missingFiles(), true);

                const pollTimer = setInterval(refresh, 250);

                // 长时间网络波动时，每15秒重新确认一次遗漏资源是否仍在队列中。
                const retryTimer = setInterval(() => {
                    retryTick++;
                    const missing = missingFiles();
                    if (missing.length > 0) {
                        scenePreloader.enqueue(missing, true);
                        if (retryTick % 4 === 0 && note) {
                            note.innerText = '场景仍在准备中，请保持页面开启，完成后会自动继续。';
                        }
                    }
                }, 15000);

                refresh();
            }
        };

        return {
            timeline: [waitTrial],
            conditional_function: function() {
                return files.some(f => !scenePreloader.isLoaded(f));
            }
        };
    }

                <div style="flex:0 0 10%;width:100%;display:flex;align-items:center;justify-content:flex-start;background:#15151a;font-size:clamp(16px,1.35vw,26px);font-weight:bold;color:#fff;padding:0 clamp(16px,4vw,55px);box-sizing:border-box;border-bottom:2px solid #333;overflow:hidden;">
                    <span style="display:block;width:100%;line-height:1.4;">${trialData.text}</span>
                </div>

                <div style="flex:0 0 35%;width:100%;display:flex;justify-content:center;align-items:center;background:#15151a;box-sizing:border-box;padding:8px 0;">
                    ${renderSceneImage(trialData.image)}
                </div>

                <div style="flex:0 0 30%;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;background:#1e1e24;box-sizing:border-box;border-top:2px solid #333;border-bottom:2px solid #444;padding:7px 0 4px;">
                    <div class="assistant-badge">${assistantDisplay}</div>
                    <div class="matrix-shell">${matrixHTML}</div>
                </div>

                <div class="rating-zone" style="flex:0 0 25%;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#2b2b36;box-sizing:border-box;padding:20px 12px 6px;overflow:hidden;">
                    <div class="rating-topline">
                        <div id="rating-progress" class="rating-progress">第 1 题 / 共 2 题</div>
                        <button id="rating-back" class="rating-back hidden" type="button">返回上一题</button>
                    </div>
                    <div id="rating-question" class="rating-question">${question1}</div>
                    <div id="rating-options" class="rating-options">${ratingButtons}</div>
                    <div class="rating-anchors"><span>1 非常不赞同</span><span>3 一般</span><span>5 非常赞同</span></div>
                    <button id="rating-confirm" class="rating-confirm" disabled>确认并继续</button>
                </div>
            </div>`,
            on_load: function() {
                let totalStart = null;
                let phase = 1;
                let phaseStart = null;
                let trustDraft = null;
                let coopDraft = null;
                let trustScore = null;
                let coopScore = null;
                let trustRT = 0;
                let coopRT = 0;
                let backToQ1Count = 0;

                const options = Array.from(document.querySelectorAll('.rating-option'));
                const confirmBtn = document.getElementById('rating-confirm');
                const backBtn = document.getElementById('rating-back');
                const questionEl = document.getElementById('rating-question');
                const trialShell = document.querySelector('.trial-shell');
                let trialResizeObserver = null;

                function elementIsClipped(el) {
                    if (!el) return false;
                    return (el.scrollHeight - el.clientHeight > 2) || (el.scrollWidth - el.clientWidth > 2);
                }

                function enableAdaptiveLayoutIfNeeded() {
                    if (!trialShell || trialShell.classList.contains('adaptive-scroll')) return;
                    const children = Array.from(trialShell.children);
                    const clippedChild = children.some(elementIsClipped);
                    const clippedQuestion = elementIsClipped(questionEl);
                    const clippedMatrix = elementIsClipped(trialShell.querySelector('.matrix-shell'));
                    const viewportH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                    const shellTooTall = trialShell.scrollHeight > viewportH + 3;
                    if (clippedChild || clippedQuestion || clippedMatrix || shellTooTall) {
                        trialShell.classList.add('adaptive-scroll');
                    }
                }

                if (trialShell) {
                    requestAnimationFrame(() => requestAnimationFrame(enableAdaptiveLayoutIfNeeded));
                    if ('ResizeObserver' in window) {
                        trialResizeObserver = new ResizeObserver(enableAdaptiveLayoutIfNeeded);
                        trialResizeObserver.observe(trialShell);
                        Array.from(trialShell.children).forEach(el => trialResizeObserver.observe(el));
                    }
                }
                const sceneImg = document.getElementById('scene-image');
                const sceneHint = document.getElementById('scene-load-hint');
                const imagePath = sceneImg ? sceneImg.dataset.src : `img/${trialData.image}`;
                const imagePreloadedBeforeTrial = scenePreloader.isLoaded(imagePath);
                const preloadLoadedCountAtTrialStart = scenePreloader.loadedCount();
                const imageWaitStartedAt = Date.now();
                let imageWaitMs = null;
                let sceneReady = false;
                let slowHintTimer = null;

                function enableRatingsAfterImage() {
                    if (sceneReady) return;
                    sceneReady = true;
                    imageWaitMs = Date.now() - imageWaitStartedAt;
                    totalStart = Date.now();
                    phaseStart = totalStart;
                    scenePreloader.markLoaded(imagePath);
                    if (slowHintTimer) clearTimeout(slowHintTimer);
                    if (sceneHint) sceneHint.style.display = 'none';
                    options.forEach(btn => btn.disabled = false);
                    requestAnimationFrame(enableAdaptiveLayoutIfNeeded);
                }

                function showImageError(error) {
                    sceneReady = false;
                    options.forEach(btn => btn.disabled = true);
                    confirmBtn.disabled = true;
                    if (sceneHint) {
                        sceneHint.classList.add('error');
                        sceneHint.style.display = 'flex';
                        sceneHint.innerText = '当前驾驶场景暂未加载成功，正在重试…';
                    }
                    console.error('trial image load error', imagePath, error);
                    setTimeout(() => requestCurrentImage(), 1800);
                }

                function attachActualImage() {
                    if (!sceneImg || sceneReady) return;
                    sceneImg.addEventListener('load', enableRatingsAfterImage, { once:true });
                    sceneImg.addEventListener('error', showImageError, { once:true });
                    sceneImg.src = imagePath;
                    if (sceneImg.complete && sceneImg.naturalWidth > 0) {
                        enableRatingsAfterImage();
                    }
                }

                function requestCurrentImage() {
                    if (!sceneImg || sceneReady) return;
                    if (scenePreloader.isLoaded(imagePath)) {
                        attachActualImage();
                        return;
                    }
                    if (sceneHint) {
                        sceneHint.classList.remove('error');
                        sceneHint.style.display = 'flex';
                        sceneHint.innerText = '正在准备当前驾驶场景，请稍候…';
                    }
                    scenePreloader.whenLoaded(
                        imagePath,
                        attachActualImage,
                        function() {
                            // 后台预加载若连续报错，则回退到当前 trial 的普通图片请求。
                            attachActualImage();
                        }
                    );
                }

                slowHintTimer = setTimeout(() => {
                    if (!sceneReady && sceneHint) {
                        sceneHint.innerText = '当前网络较慢，驾驶场景仍在加载，请稍候…';
                    }
                }, 20000);

                requestCurrentImage();

                function renderSelection(value) {
                    options.forEach(btn => btn.classList.toggle('selected', Number(btn.dataset.score) === value));
                    confirmBtn.disabled = (!sceneReady || value === null);
                }

                function showPhase(nextPhase) {
                    phase = nextPhase;
                    phaseStart = Date.now();
                    if (phase === 1) {
                        document.getElementById('rating-progress').innerText = '第 1 题 / 共 2 题';
                        questionEl.innerText = question1;
                        questionEl.classList.remove('long-question');
                        backBtn.classList.add('hidden');
                        renderSelection(trustDraft);
                    } else {
                        document.getElementById('rating-progress').innerText = '第 2 题 / 共 2 题';
                        questionEl.innerText = question2;
                        questionEl.classList.add('long-question');
                        backBtn.classList.remove('hidden');
                        renderSelection(coopDraft);
                    }
                    requestAnimationFrame(enableAdaptiveLayoutIfNeeded);
                }

                options.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const score = Number(this.dataset.score);
                        if (phase === 1) trustDraft = score;
                        else coopDraft = score;
                        renderSelection(score);
                    });
                });

                backBtn.addEventListener('click', function() {
                    if (phase !== 2) return;
                    coopRT += Date.now() - phaseStart;
                    backToQ1Count++;
                    showPhase(1);
                });

                confirmBtn.addEventListener('click', function() {
                    if (phase === 1 && trustDraft === null) return;
                    if (phase === 2 && coopDraft === null) return;
                    if (phase === 1) {
                        trustScore = trustDraft;
                        trustRT += Date.now() - phaseStart;
                        showPhase(2);
                    } else {
                        coopScore = coopDraft;
                        coopRT += Date.now() - phaseStart;
                        if (trialResizeObserver) trialResizeObserver.disconnect();
                        const imageBase = String(trialData.image || '').replace(/\.(?:png|webp)$/i,'');
                        const numMatch = imageBase.match(/(\d+)$/);
                        const sceneNum = numMatch ? Number(numMatch[1]) : trialData.scene;
                        const imageNumber = trialData.risk === 'High' ? sceneNum : (trialData.risk === 'Low' ? 6 + sceneNum : 0);
                        const seqName = versionIndex === 0 ? 'A' : 'B';

                        const result = {
                            Event_Type: isFormal ? 'Formal_Trial' : 'Practice_Trial',
                            Subject_ID: currentSubjectId,
                            DataPipe_Condition: dataPipeCondition,
                            Sequence: seqName,
                            Spatial_Layout: spatialLayout,
                            Formal_Trial_Order: isFormal ? trialData.formalTrialOrder : 0,
                            Block: isFormal ? trialData.block : 0,
                            Block_Position: isFormal ? trialData.blockPosition : 0,
                            Image_Number: imageNumber,
                            Image_ID: imageBase,
                            Image_File: trialData.image,
                            Scene_ID: trialData.scene,
                            Risk_Level: trialData.risk,
                            Assistant_Label: isFormal ? trialData.assistantLabel : 'Practice',
                            Config_Code: `${trialData.config.abilityLevel}/${trialData.config.emotionLevel}`,
                            Config_Type: trialData.config.key,
                            Config_Name_CN: trialData.config.internalName,
                            Ability_Level: trialData.config.abilityLevel,
                            Emotion_Level: trialData.config.emotionLevel,
                            Trust_Score: trustScore,
                            Trust_RT_ms: trustRT,
                            Cooperation_Score: coopScore,
                            Cooperation_RT_ms: coopRT,
                            Back_to_Q1_Count: backToQ1Count,
                            Total_Trial_Time_ms: totalStart === null ? null : Date.now() - totalStart,
                            Image_Preloaded_Before_Trial: imagePreloadedBeforeTrial ? 1 : 0,
                            Image_Wait_ms: imageWaitMs,
                            Preload_Loaded_Count_At_Trial_Start: preloadLoadedCountAtTrialStart,
                            Baseline_Ability_Points: baselineAbility,
                            Baseline_Emotion_Points: baselineEmotion,
                            Browser_Context: getBrowserContext(),
                            Image_Format: 'lossless_webp'
                        };
                        jsPsych.finishTrial(result);
                    }
                });
            }
        };
    }


    /* =========================================================
       浏览器环境记录（不再阻止微信内置浏览器）
       ---------------------------------------------------------
       当前正式候选版允许微信、Safari、Chrome 等环境进入实验，
       用于实测完整实验流程与 DataPipe 上传稳定性。
       ========================================================= */
    function isWeChatWebView() {
        return /MicroMessenger/i.test(navigator.userAgent || '');
    }

    function getBrowserContext() {
        if (isWeChatWebView()) return 'WeChat_WebView';
        if (/CriOS|Chrome/i.test(navigator.userAgent || '')) return 'Chrome_or_Chromium';
        if (/EdgiOS|EdgA|Edg/i.test(navigator.userAgent || '')) return 'Edge';
        if (/Firefox|FxiOS/i.test(navigator.userAgent || '')) return 'Firefox';
        if (/Safari/i.test(navigator.userAgent || '') && !/Chrome|CriOS|Edg|FxiOS/i.test(navigator.userAgent || '')) return 'Safari';
        return 'Other';
    }

    function setupBrowserGuard() {
        // 本版本不阻止任何浏览器，只记录环境。
        const blocker = document.getElementById('wechat-blocker');
        if (blocker) blocker.style.display = 'none';
    }

    setupBrowserGuard();

    /* =========================================================
       4. 启动实验
       ========================================================= */

    function getParticipantIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        const pid = (params.get('pid') || '').trim();
        return /^[A-Za-z0-9_-]{1,30}$/.test(pid) ? pid : '';
    }

    function applyParticipantIdFromURL() {
        const pid = getParticipantIdFromURL();
        if (!pid) return;

        const input = document.getElementById('subject-id-input');
        if (input) {
            input.value = pid;
            input.readOnly = true;
            input.style.opacity = '0.92';
        }

        const info = document.querySelector('#login-screen .login-box > div:nth-child(2)');
        if (info) {
            info.innerHTML = '已从前置问卷自动识别实验编号：<b style="color:#fff;">' + pid +
                '</b><br><span style="font-size:14px;color:#8f9aa5;">请确认后点击“进入体验”。</span>';
        }
    }

    applyParticipantIdFromURL();

    async function startExperiment() {
        const inputVal = document.getElementById('subject-id-input').value.trim();
        if (!inputVal || !/^[A-Za-z0-9_-]{1,30}$/.test(inputVal)) {
            alert('请输入有效的被试编号（仅使用字母、数字、下划线或短横线）。');
            return;
        }

        currentSubjectId = inputVal;

        const startButton = document.querySelector('.login-btn');
        const originalButtonText = startButton.innerText;
        startButton.disabled = true;
        startButton.innerText = '正在连接实验服务器…';

        try {
            dataPipeCondition = await getDataPipeCondition();
            if (dataPipeCondition < 0 || dataPipeCondition > 3) {
                throw new Error(`收到未预期的条件编号：${dataPipeCondition}。请确认 DataPipe 的条件数设置为 4。`);
            }
        } catch (error) {
            console.error(error);
            startButton.disabled = false;
            startButton.innerText = originalButtonText;
            if (DATAPIPE_REQUIRED) {
                alert('暂时无法连接实验服务器或获取平衡条件，请检查网络后重试。\n\n' + (error.message || error));
                return;
            } else {
                // 仅供本地开发测试：DataPipe 不可用时按被试编号回退。
                dataPipeCondition = Array.from(String(currentSubjectId)).reduce((a,c)=>a+c.charCodeAt(0),0) % 4;
            }
        }

        // 4个在线条件 = 2套正式试次顺序（A/B） × 2种左右布局。
        // 四个助手的字母标签固定，不参与版本平衡。
        versionIndex = Math.floor(dataPipeCondition / 2); // 0=SeqA, 1=SeqB
        spatialLayout = (dataPipeCondition % 2 === 0) ? 'CompLeft' : 'WarmthLeft';
        setupAssistantLabels();
        const seqName = versionIndex === 0 ? 'SeqA' : 'SeqB';
        currentVersion = `DP${dataPipeCondition}_${seqName}_${spatialLayout}_FixedLabels`;

        jsPsych.data.addProperties({
            Subject_ID: currentSubjectId,
            Session_UUID: sessionUUID,
            DataPipe_Condition: dataPipeCondition,
            Version: currentVersion,
            Spatial_Layout: spatialLayout,
            Browser_Context: getBrowserContext(),
            User_Agent: navigator.userAgent || '',
            Image_Format: 'lossless_webp'
        });

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('jspsych-target').innerHTML = '';

        const formalTrials = buildFormalTrials();
        const practiceTrial = {
            image:'test.webp', risk:'Practice', scene:0, stimIndex:-1,
            text:'当前处于拥堵路段。请观察当前道路情况和智驾助手的功能水平，再根据自己的感受完成评价。',
            config:{ key:'PracticeBalanced', internalName:'练习配置', abilityLevel:2, emotionLevel:2 },
            assistantLabel:'Practice'
        };

        // 资源优先级：练习图最先；正式图片按“该版本第一次真正出现的顺序”排队。
        const firstUseFormalImages = [];
        const seenFormalImages = new Set();
        formalTrials.forEach(t => {
            const path = `img/${t.image}`;
            if (!seenFormalImages.has(path)) {
                seenFormalImages.add(path);
                firstUseFormalImages.push(path);
            }
        });
        const scenePriorityQueue = ['img/test.webp', ...firstUseFormalImages];

        // 关键：不等待13张全部完成。滚动预加载在后台进行，实验前半段立即开始。
        scenePreloader.start(scenePriorityQueue);

        let timeline = [];

        /* =========================================================

           ========================================================= */

                </div>
                <div style="margin-top:24px;"><button id="welcome-continue" class="continue-btn">开始实验</button></div>

                    <div class="quiz-options">
                        <button class="quiz-option" data-answer="1">1　感知功能</button>

            data: {Event_Type:'Concept_Ability'},

                </div>
            </div>`,
            data: {Event_Type:'Concept_Emotion'},
            on_load: function() {

                document.querySelectorAll('.quiz-option').forEach(btn => {

                        attempts++;
                        document.querySelectorAll('.quiz-option').forEach(x => x.classList.remove('selected','correct','wrong'));
                        this.classList.add('selected');

                        document.getElementById('emotion-feedback').style.color = correct ? '#4CAF50' : '#ffb74d';

                        document.getElementById('emotion-continue').disabled = !correct;

        timeline.push(createBaselineAllocationNode());
        timeline.push(createAssistantIntroNode());
        timeline.push(createPracticeInstructionNode());
        timeline.push(createRatingTrialNode(practiceTrial, false));

        // 练习结束后、正式指导语之前做最后一次资源同步。
        // 若13张图片已全部完成，此节点会自动跳过，不打断体验。
        timeline.push(createFormalResourceGateNode(scenePriorityQueue));

        timeline.push(createFormalInstructionNode());

        for (let i=0; i<formalTrials.length; i++) {
            timeline.push(createRatingTrialNode(formalTrials[i], true));
            if (i === 23) timeline.push(createRestNode());
        }

        jsPsych.run(timeline);
    }
</script>
